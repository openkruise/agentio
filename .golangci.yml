version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - govet
    - errcheck
    - revive
    - dupl
    - funlen
    - gocyclo
    - errorlint
    - modernize
  settings:
    errcheck:
      check-blank: true
    revive:
      rules:
        - name: exported
        - name: unexported-return
    dupl:
      threshold: 150
    funlen:
      lines: 100
      statements: 60
    gocyclo:
      min-complexity: 20
    errorlint:
      errorf: true
      asserts: true
      comparison: true
  exclusions:
    generated: strict
    rules:
      # Keep the migrated rule generators' structure and exports reviewable against their source.
      - path: ^pkg/proxyinit/(iptables|nftables|config)/
        linters:
          - dupl
          - funlen
          - gocyclo
          - revive
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gocyclo
          - revive

formatters:
  enable:
    - goimports
    - golines
  settings:
    golines:
      max-len: 120
      tab-len: 4
      shorten-comments: false
      reformat-tags: false
    goimports:
      local-prefixes:
        - github.com/openkruise/agentio
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
