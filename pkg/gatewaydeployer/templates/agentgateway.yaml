# Adapted from Istio 1.31.0's agentgateway deployment template for file configuration and native workload certificate management.
{{- $agentgateway := .Values.global.agentgateway | default (strdict) }}
{{- $ca := $agentgateway.ca | default (strdict) }}
{{- $sds := .Values.global.sds | default (strdict) }}
{{- $token := $sds.token | default (strdict) }}
{{- $certs := annotation .ObjectMeta "gateway.agentio.kruise.io/agentgateway-certs" "" }}
{{- $annotations := omit .InfrastructureAnnotations "kubectl.kubernetes.io/last-applied-configuration" "gateway.agentio.kruise.io/name-override" "gateway.agentio.kruise.io/service-account" "gateway.agentio.kruise.io/controller-version" "gateway.agentio.kruise.io/agentgateway-certs" }}
{{- $labels := strdict "gateway.networking.k8s.io/gateway-name" .Name "gateway.networking.k8s.io/gateway-class-name" .GatewayClass "gateway.agentio.kruise.io/managed" .ControllerLabel "agentio.kruise.io/dataplane-mode" "none" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .ServiceAccount | quote }}
  namespace: {{ .Namespace | quote }}
  labels: {{ toJsonMap .InfrastructureLabels $labels }}
  annotations: {{ toJsonMap $annotations }}
  {{- if ge .KubeVersion 128 }}
  ownerReferences:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    name: {{ .Name | quote }}
    uid: {{ .UID | quote }}
  {{- end }}
automountServiceAccountToken: false
---
{{- if .AgentgatewayConfig }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .AgentgatewayConfigName | quote }}
  namespace: {{ .Namespace | quote }}
  labels: {{ toJsonMap .InfrastructureLabels $labels }}
  ownerReferences:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    name: {{ .Name | quote }}
    uid: {{ .UID | quote }}
data:
  config.yaml: {{ .AgentgatewayConfig | quote }}
  {{- if .AgentgatewayTrustBundle }}
  upstream-root.pem: {{ .AgentgatewayTrustBundle | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .DeploymentName | quote }}
  namespace: {{ .Namespace | quote }}
  labels: {{ toJsonMap .InfrastructureLabels $labels }}
  annotations: {{ toJsonMap $annotations }}
  ownerReferences:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    name: {{ .Name | quote }}
    uid: {{ .UID | quote }}
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{ .GatewayNameLabel | quote }}: {{ .Name | quote }}
  template:
    metadata:
      labels: {{ toJsonMap .InfrastructureLabels $labels }}
      annotations: {{ toJsonMap $annotations (strdict "gateway.agentio.kruise.io/config-hash" .AgentgatewayConfigHash "prometheus.io/path" "/metrics" "prometheus.io/port" "15020" "prometheus.io/scrape" "true") }}
    spec:
      serviceAccountName: {{ .ServiceAccount | quote }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $agentgateway.terminationGracePeriodSeconds | default 30 }}
      {{- with $agentgateway.nodeSelector }}
      nodeSelector: {{ toJson . }}
      {{- end }}
      {{- with $agentgateway.tolerations }}
      tolerations: {{ toJson . }}
      {{- end }}
      {{- with $agentgateway.affinity }}
      affinity: {{ toJson . }}
      {{- end }}
      {{- with $agentgateway.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toJson . }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
      - name: {{ . | quote }}
      {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10101
        runAsGroup: 10101
        fsGroup: 10101
        seccompProfile:
          type: RuntimeDefault
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      containers:
      - name: agentgateway
        # Operator-controlled; Gateway annotations cannot override the image.
        image: {{ $agentgateway.image | default "cr.agentgateway.dev/agentgateway:v1.7.0" | quote }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy | default "IfNotPresent" | quote }}
        args: ["-f", "/etc/agentgateway/config.yaml"]
        {{- with $agentgateway.resources }}
        resources: {{ toJson (omitNil .) }}
        {{- end }}
        securityContext:
          capabilities:
            drop: [ALL]
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        ports:
        - name: metrics
          containerPort: 15020
        - name: status-port
          containerPort: 15021
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if $ca.enabled }}
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        - name: TRUST_DOMAIN
          value: {{ (valueOrDefault .TrustDomain .Values.global.trustDomain) | quote }}
        - name: CLUSTER_ID
          value: {{ .ClusterID | quote }}
        - name: CA_ADDRESS
          value: {{ .AgentgatewayCAAddress | quote }}
        - name: CA_AUTH_TOKEN
          value: /var/run/secrets/tokens/agentio-token
        - name: CA_ROOT_CA
          value: /var/run/secrets/agentio/root-cert.pem
        {{- end }}
        - name: CPU_LIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
              divisor: "1"
        startupProbe:
          httpGet: {path: /healthz/ready, port: 15021}
          periodSeconds: 1
          failureThreshold: 30
        readinessProbe:
          httpGet: {path: /healthz/ready, port: 15021}
          periodSeconds: 5
        volumeMounts:
        - name: config
          {{- if .AgentgatewayConfig }}
          mountPath: /etc/agentgateway
          {{- else }}
          mountPath: /etc/agentgateway/config.yaml
          subPath: config.yaml
          {{- end }}
          readOnly: true
        - name: tmp
          mountPath: /tmp
        {{- if $ca.enabled }}
        - name: agentio-ca-root
          mountPath: /var/run/secrets/agentio
          readOnly: true
        - name: agentio-ca-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
        {{- end }}
        {{- if $certs }}
        - name: certs
          mountPath: /etc/agentgateway/certs
          readOnly: true
        {{- end }}
      volumes:
      - name: config
        configMap:
          name: {{ .AgentgatewayConfigName | quote }}
          items:
          - key: config.yaml
            path: config.yaml
          {{- if .AgentgatewayTrustBundle }}
          - key: upstream-root.pem
            path: upstream-root.pem
          {{- end }}
      - name: tmp
        emptyDir: {}
      {{- if $ca.enabled }}
      - name: agentio-ca-root
        configMap:
          name: {{ .Values.global.trustBundleName | default "agentio-ca-root-cert" | quote }}
          items:
          - key: root-cert.pem
            path: root-cert.pem
      - name: agentio-ca-token
        projected:
          defaultMode: 0440
          sources:
          - serviceAccountToken:
              path: agentio-token
              expirationSeconds: 43200
              audience: {{ $token.aud | default "agentio-ca" | quote }}
      {{- end }}
      {{- if $certs }}
      - name: certs
        secret:
          secretName: {{ $certs | quote }}
          defaultMode: 0440
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .DeploymentName | quote }}
  namespace: {{ .Namespace | quote }}
  labels: {{ toJsonMap .InfrastructureLabels $labels }}
  annotations: {{ toJsonMap $annotations }}
  ownerReferences:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    name: {{ .Name | quote }}
    uid: {{ .UID | quote }}
spec:
  type: {{ .ServiceType | quote }}
  selector:
    {{ .GatewayNameLabel | quote }}: {{ .Name | quote }}
  ports: {{ toJson .Ports }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .DeploymentName | quote }}
  namespace: {{ .Namespace | quote }}
  labels: {{ toJsonMap .InfrastructureLabels $labels }}
  annotations: {{ toJsonMap $annotations }}
  ownerReferences:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    name: {{ .Name | quote }}
    uid: {{ .UID | quote }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .DeploymentName | quote }}
  maxReplicas: 1
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .DeploymentName | quote }}
  namespace: {{ .Namespace | quote }}
  labels: {{ toJsonMap .InfrastructureLabels $labels }}
  annotations: {{ toJsonMap $annotations }}
  ownerReferences:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    name: {{ .Name | quote }}
    uid: {{ .UID | quote }}
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: {{ .Name | quote }}
