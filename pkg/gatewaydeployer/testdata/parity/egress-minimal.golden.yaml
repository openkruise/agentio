apiVersion: v1
kind: ServiceAccount
metadata:
  name: "egress"
  namespace: "agentio-system"
  annotations:
    {}
  labels:
    {"gateway.networking.k8s.io/gateway-class-name":"agentio-egress","gateway.networking.k8s.io/gateway-name":"egress"}
  # Safe since 1.28: https://github.com/kubernetes/kubernetes/pull/117412
  ownerReferences:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    name: "egress"
    uid: "uid-1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "egress"
  namespace: "agentio-system"
  annotations:
    {}
  labels:
    {"gateway.agentio.kruise.io/managed":"agentio.kruise.io-egress-gateway-controller","gateway.networking.k8s.io/gateway-class-name":"agentio-egress","gateway.networking.k8s.io/gateway-name":"egress"}
  ownerReferences:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    name: "egress"
    uid: "uid-1"
spec:
  selector:
    matchLabels:
      "gateway.networking.k8s.io/gateway-name": "egress"
  template:
    metadata:
      annotations:
        {"prometheus.io/path":"/stats/prometheus","prometheus.io/port":"15020","prometheus.io/scrape":"true"}
      labels:
        {"agentio.kruise.io/dataplane-mode":"none","gateway.agentio.kruise.io/managed":"agentio.kruise.io-egress-gateway-controller","gateway.networking.k8s.io/gateway-class-name":"agentio-egress","gateway.networking.k8s.io/gateway-name":"egress"}
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: "egress"
      containers:
      - name: agentio-proxy
        ports:
        - containerPort: 15020
          name: metrics
          protocol: TCP
        - containerPort: 15021
          name: status-port
          protocol: TCP
        - containerPort: 15090
          protocol: TCP
          name: http-envoy-prom
        image: "example.com/agentio/proxyv2:1.0.0-test"

        args:
        - --domain=$(POD_NAMESPACE).svc.cluster.local
        env:
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: POD_UID
          valueFrom: {fieldRef: {fieldPath: metadata.uid}}
        - name: AGENTIO_XDS_ADDRESS
          value: "agentiod.agentio-system.svc:15012"
        - name: CA_ADDR
          value: "agentiod.agentio-system.svc:15012"
        - name: AGENTIO_GATEWAY_CONFIG
          value: "{}"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: INSTANCE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: AGENTIO_CPU_LIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
              divisor: "1"
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.memory
              divisor: "1"
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
              divisor: "1"
        - name: CLUSTER_ID
          value: "Kubernetes"
        - name: AGENTIO_META_WORKLOAD_NAME
          value: egress
        - name: AGENTIO_META_OWNER
          value: kubernetes://apis/apps/v1/namespaces/agentio-system/deployments/egress
        - name: AGENTIO_META_MESH_ID
          value: "cluster.local"
        - name: TRUST_DOMAIN
          value: "cluster.local"
        resources:
          limits:
            cpu: "2"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz/ready
            port: 15021
            scheme: HTTP
          initialDelaySeconds: 1
          periodSeconds: 1
          successThreshold: 1
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 4
          httpGet:
            path: /healthz/ready
            port: 15021
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 1
        securityContext:
          privileged: false
          runAsGroup: 1337
          runAsUser: 1337
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /var/run/secrets/workload-spiffe-uds
          name: workload-socket
        - mountPath: /var/run/secrets/agentio
          name: agentiod-ca-cert
        - mountPath: /var/lib/agentio/data
          name: agentio-data
        - mountPath: /etc/agentio/proxy
          name: agentio-envoy
        - mountPath: /var/run/secrets/tokens
          name: agentio-token
        - mountPath: /etc/agentio/pod
          name: agentio-podinfo
      initContainers:
      - name: agentio-porter
        restartPolicy: Always
        image: "agentio/agentio-porter:test"
        imagePullPolicy: ""
        args:
          - --domain=$(POD_NAMESPACE).svc.cluster.local
          - --xds-address=agentiod.agentio-system.svc:15012
          - --cluster-id=test-cluster
          - --grpc-port=9002
          - --grpc-health-port=9003
          - --xds-cache-idle-ttl=1m
          - --xds-cache-max-entries=10000
        env:
          - name: POD_NAME
            valueFrom: {fieldRef: {fieldPath: metadata.name}}
          - name: POD_NAMESPACE
            valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          - name: POD_UID
            valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          - name: POD_IP
            valueFrom: {fieldRef: {fieldPath: status.podIP}}
        ports:
          - name: health
            containerPort: 9003
          - name: porter-metrics
            containerPort: 9004
        readinessProbe:
          grpc: {port: 9003, service: readiness}
          periodSeconds: 5
        livenessProbe:
          grpc: {port: 9003, service: liveness}
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1337
          runAsGroup: 1337
        resources:
          limits:
            cpu: "1"
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
          - {name: agentiod-ca-cert, mountPath: /var/run/secrets/agentio, readOnly: true}
          - {name: agentio-token, mountPath: /var/run/secrets/tokens, readOnly: true}
      volumes:
      - emptyDir: {}
        name: workload-socket
      - emptyDir:
          medium: Memory
        name: agentio-envoy
      - emptyDir:
          medium: Memory
        name: go-proxy-envoy
      - emptyDir: {}
        name: agentio-data
      - emptyDir: {}
        name: go-proxy-data
      - downwardAPI:
          items:
          - fieldRef:
              fieldPath: metadata.labels
            path: labels
          - fieldRef:
              fieldPath: metadata.annotations
            path: annotations
        name: agentio-podinfo
      - name: agentio-token
        projected:
          sources:
          - serviceAccountToken:
              audience: "agentio-ca"
              expirationSeconds: 43200
              path: agentio-token
      - name: agentiod-ca-cert
        configMap:
          name: agentio-ca-root-cert
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    {}
  labels:
    {"gateway.networking.k8s.io/gateway-class-name":"agentio-egress","gateway.networking.k8s.io/gateway-name":"egress"}
  name: "egress"
  namespace: "agentio-system"
  ownerReferences:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    name: "egress"
    uid: "uid-1"
spec:
  ipFamilyPolicy: PreferDualStack
  ports:
  - name: "status-port"
    port: 15021
    protocol: TCP
    appProtocol: tcp
  - name: "mesh"
    port: 15008
    protocol: TCP
    appProtocol: hbone
  selector:
    "gateway.networking.k8s.io/gateway-name": "egress"
  type: "ClusterIP"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: "egress"
  namespace: "agentio-system"
  annotations:
    {}
  labels:
    {"gateway.networking.k8s.io/gateway-class-name":"agentio-egress","gateway.networking.k8s.io/gateway-name":"egress"}
  ownerReferences:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: egress
      uid: "uid-1"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name:  "egress"
  maxReplicas: 1
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: "egress"
  namespace: "agentio-system"
  annotations:
    {}
  labels:
    {"gateway.networking.k8s.io/gateway-class-name":"agentio-egress","gateway.networking.k8s.io/gateway-name":"egress"}
  ownerReferences:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: egress
      uid: "uid-1"
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: "egress"

