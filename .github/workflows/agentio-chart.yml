name: agentio-chart

on:
  pull_request:
    branches:
      - master
    paths:
      - "manifests/charts/agentio/**"
      - "manifests/charts/*_test.go"
      - "pkg/gatewaydeployer/**"
      - "tools/agentio-chart-sync/**"
      - "tools/prepare-release-chart.sh"
      - ".github/workflows/sync-sandbox-manager-agentio-chart.yml"
      - ".github/workflows/agentio-release.yml"
      - ".github/workflows/agentio-chart.yml"
  push:
    branches:
      - master
    paths:
      - "manifests/charts/agentio/**"
      - "manifests/charts/*_test.go"
      - "pkg/gatewaydeployer/**"
      - "tools/agentio-chart-sync/**"
      - "tools/prepare-release-chart.sh"
      - ".github/workflows/sync-sandbox-manager-agentio-chart.yml"
      - ".github/workflows/agentio-release.yml"
      - ".github/workflows/agentio-chart.yml"

permissions:
  contents: read

env:
  CHART: manifests/charts/agentio

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v3.16.2
      - name: Helm lint
        run: helm lint "$CHART"
      - name: Run chart render contract tests
        run: go test ./manifests/charts ./pkg/gatewaydeployer ./tools/agentio-chart-sync -count=1
      - name: Helm template — defaults
        run: helm template agentio "$CHART" >/dev/null
      - name: Helm template — sidecar profile
        run: helm template agentio "$CHART" --set profile=sidecar >/dev/null
      - name: Helm template — ambient profile
        run: helm template agentio "$CHART" --set profile=ambient >/dev/null
      - name: Helm template — ClusterTrustBundle enabled
        run: helm template agentio "$CHART" --set profile=ambient --set ztunnel.trustBundle.useClusterTrustBundle=true >/dev/null
      - name: Helm template — Gateway API egress
        run: >-
          helm template agentio "$CHART"
          --set agentiod.gatewayDeployer.enabled=true
          >/dev/null
