name: sync-sandbox-manager-agentio-chart

on:
  workflow_call:
    inputs:
      version:
        description: 'Released Agentio chart version to embed'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Released Agentio chart version to embed'
        required: true
        type: string

permissions:
  contents: read

env:
  CHART_REPOSITORY: openkruise/charts
  SANDBOX_MANAGER_CHART: versions/kruise-agents-sandbox-manager/next
  SANDBOX_CONTROLLER_CHART: versions/kruise-agents-sandbox-controller/next

concurrency:
  group: sync-sandbox-manager-agentio-chart-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - name: Check out Agentio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: agentio
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agentio/go.mod
          cache: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.2

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENTIO_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIO_SYNC_APP_PRIVATE_KEY }}
          owner: openkruise
          repositories: charts
          permission-contents: write
          permission-pull-requests: write

      - name: Check out OpenKruise charts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CHART_REPOSITORY }}
          ref: master
          path: openkruise-charts
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Pull released Agentio chart
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/released-agentio"
          helm pull oci://docker.io/openkruise/agentio \
            --version "$VERSION" \
            --untar \
            --untardir "$RUNNER_TEMP/released-agentio"

      - name: Verify release image tags against the published BOM
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "agentio-${VERSION}-bom.json" --dir "$RUNNER_TEMP/released-agentio"
          bom="$RUNNER_TEMP/released-agentio/agentio-${VERSION}-bom.json"
          jq -e --arg version "$VERSION" '.version == $version and (.images | keys == ["agentiod", "cni", "epe", "gateway", "porter", "proxyInit", "ztunnel"])' "$bom" >/dev/null
          jq -er '.images[]' "$bom" > "$RUNNER_TEMP/released-agentio/images"
          while IFS= read -r source; do
            if [[ ! "$source" =~ ^docker\.io/openkruise/[a-z0-9-]+@sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid released image: $source" >&2
              exit 1
            fi
            target="${source%@*}:${VERSION}"
            actual=$(crane digest "$target")
            if [[ "$actual" != "${source##*@}" ]]; then
              echo "Version tag $target does not match the release BOM: $actual" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/released-agentio/images"

      - name: Sync released OpenKruise integration bundle
        working-directory: agentio
        env:
          VERSION: ${{ inputs.version }}
        run: |
          go test ./tools/agentio-chart-sync

          released_chart="$RUNNER_TEMP/released-agentio/agentio"
          bundle="$released_chart/integrations/openkruise"
          if [[ ! -d "$bundle" ]]; then
            echo "Agentio ${VERSION} predates embedded OpenKruise integration bundles and cannot be synchronized by this workflow." >&2
            exit 1
          fi

          go run ./tools/agentio-chart-sync verify \
            --bundle "$bundle"

          go run ./tools/agentio-chart-sync apply \
            --bundle "$bundle" \
            --manager-chart "$GITHUB_WORKSPACE/openkruise-charts/$SANDBOX_MANAGER_CHART" \
            --controller-chart "$GITHUB_WORKSPACE/openkruise-charts/$SANDBOX_CONTROLLER_CHART"

      - name: Verify generated OpenKruise charts
        working-directory: openkruise-charts
        run: |
          target="$SANDBOX_MANAGER_CHART"
          disabled="$RUNNER_TEMP/sandbox-manager-disabled.yaml"
          enabled="$RUNNER_TEMP/sandbox-manager-agentio-enabled.yaml"

          helm lint "$target" \
            --set e2b.adminApiKey=test \
            --set ingress.className=test
          helm template sandbox-manager "$target" \
            --set e2b.adminApiKey=test \
            --set ingress.className=test >"$disabled"
          if grep '# Source: .*templates/agentio/' "$disabled" | grep -q -v '/crds.yaml$'; then
            echo "Non-CRD Agentio resources rendered while agentio.enabled=false" >&2
            exit 1
          fi
          if [[ "$(grep -c '^kind: CustomResourceDefinition$' "$disabled" || true)" -ne 4 ]]; then
            echo "Expected four Agentio CRDs while agentio.enabled=false" >&2
            exit 1
          fi
          if [[ "$(grep -c 'helm.sh/resource-policy: keep' "$disabled" || true)" -ne 4 ]]; then
            echo "Expected all Agentio CRDs to carry the Helm keep policy" >&2
            exit 1
          fi

          helm template sandbox-manager "$target" \
            --set e2b.adminApiKey=test \
            --set ingress.className=test \
            --set agentio.enabled=true >"$enabled"
          if ! grep '# Source: .*templates/agentio/' "$enabled" | grep -q -v '/crds.yaml$'; then
            echo "Non-CRD Agentio resources did not render while agentio.enabled=true" >&2
            exit 1
          fi

          for unsupported in cni ztunnel NOTES.txt agentiod/injector.yaml; do
            if [[ -e "$target/templates/agentio/$unsupported" ]]; then
              echo "Generated sandbox-manager chart contains unsupported template: $unsupported" >&2
              exit 1
            fi
          done
          for unsupported in \
            egress-gateway.yaml \
            agentgateway.yaml \
            kruise-agents-traffic-proxy-injection.tpl \
            waypoint-injection-template.yaml \
            ztunnel-injection-template.yaml; do
            if [[ -e "$target/files/agentio/$unsupported" ]]; then
              echo "Generated sandbox-manager chart contains unsupported file: $unsupported" >&2
              exit 1
            fi
          done
          if grep -E '^  (profile|cni|ztunnel):' "$target/values.yaml"; then
            echo "Generated sandbox-manager values expose ambient or sidecar injection settings" >&2
            exit 1
          fi
          if ! grep -A1 'name: AGENTIO_ENABLE_SIDECAR_INJECTOR' "$enabled" | grep -q 'value: "false"'; then
            echo "Generated Agentio control plane does not disable its sidecar injector" >&2
            exit 1
          fi

          if grep -R -E '(^|[[:space:]])(chartVersion|appVersion|sourceCommit):' \
            "$target/templates/agentio" "$target/values.yaml"; then
            echo "Generated sandbox-manager chart contains forbidden Agentio version metadata" >&2
            exit 1
          fi

          controller_target="$SANDBOX_CONTROLLER_CHART"
          controller_rendered="$RUNNER_TEMP/sandbox-controller-agentio.yaml"
          traffic_proxy_json="$RUNNER_TEMP/traffic-proxy.json"
          helm lint "$controller_target"
          helm template sandbox-controller "$controller_target" \
            --namespace sandbox-system >"$controller_rendered"
          awk '
            /^  traffic-proxy: \|/ { found=1; capture=1; next }
            capture && (/^  [^[:space:]]/ || /^---$/) { capture=0 }
            capture { sub(/^    /, ""); print }
            END { if (!found) exit 1 }
          ' "$controller_rendered" >"$traffic_proxy_json"
          jq -e '
            .annotations["networking.agents.kruise.io/sidecar-proxy"] == "traffic-proxy" and
            (.labels | has("networking.agents.kruise.io/proxy-type") | not) and
            ([.initContainers[].name] == ["agentio-init", "traffic-proxy"]) and
            (.initContainers[1].restartPolicy == "Always") and
            ([.initContainers[1].env[] | select(.name == "XDS_ADDRESS") | .value] ==
              ["agentiod.sandbox-system.svc.cluster.local:15012"])
          ' "$traffic_proxy_json" >/dev/null

          git diff --check

      - name: Publish sync branch and pull request
        working-directory: openkruise-charts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          branch="sync-agentio-sandbox-manager-${VERSION}"
          target="$SANDBOX_MANAGER_CHART"
          generated_paths=(
            "$target/values.yaml"
            "$target/templates/agentio"
            "$target/files/agentio"
            "$SANDBOX_CONTROLLER_CHART/values.yaml"
            "$SANDBOX_CONTROLLER_CHART/templates"
          )

          if [[ -z "$(git status --porcelain -- "${generated_paths[@]}")" ]]; then
            echo "OpenKruise charts already contain the generated Agentio content; skipping."
            exit 0
          fi

          if git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"; then
            while IFS= read -r changed; do
              case "$changed" in
                "$target/values.yaml"|"$target/templates/agentio/"*|"$target/files/agentio/"*|\
                "$SANDBOX_CONTROLLER_CHART/values.yaml"|"$SANDBOX_CONTROLLER_CHART/templates/"*) ;;
                *)
                  echo "Existing branch contains an unexpected change: $changed" >&2
                  exit 1
                  ;;
              esac
            done < <(git diff --name-only origin/master..."origin/${branch}")

            if ! git diff --quiet "origin/${branch}" -- "${generated_paths[@]}"; then
              echo "Existing branch contains different generated Agentio content" >&2
              exit 1
            fi

            pr_state=$(gh pr list \
              --repo "$CHART_REPOSITORY" \
              --head "$branch" \
              --state all \
              --json state \
              --jq '.[0].state // ""')
            pr_url=$(gh pr list \
              --repo "$CHART_REPOSITORY" \
              --head "$branch" \
              --state all \
              --json url \
              --jq '.[0].url // ""')
            case "$pr_state" in
              OPEN|MERGED)
                echo "Agentio chart sync pull request already exists: ${pr_url}"
                exit 0
                ;;
              CLOSED)
                echo "Agentio chart sync pull request was closed without merging: ${pr_url}" >&2
                exit 1
                ;;
            esac

            gh pr create \
              --repo "$CHART_REPOSITORY" \
              --base master \
              --head "$branch" \
              --title "feat(kruise-agents): sync Agentio ${VERSION}" \
              --body "Embeds the released Agentio ${VERSION} chart into the sandbox-manager next chart and syncs its Kruise Agents traffic-proxy injection configuration into the sandbox-controller next chart. Source release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}."
            exit 0
          fi

          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${generated_paths[@]}"
          git commit --signoff -m "feat(kruise-agents): sync agentio ${VERSION}"
          git push origin "HEAD:refs/heads/${branch}"

          gh pr create \
            --repo "$CHART_REPOSITORY" \
            --base master \
            --head "$branch" \
            --title "feat(kruise-agents): sync Agentio ${VERSION}" \
            --body "Embeds the released Agentio ${VERSION} chart into the sandbox-manager next chart and syncs its Kruise Agents traffic-proxy injection configuration into the sandbox-controller next chart. Source release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION}."
