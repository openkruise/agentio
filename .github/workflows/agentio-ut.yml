name: agentio-ut

on:
  workflow_call:
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "logo/**"
      - "releasenotes/**"
      - ".markdownlint-cli2.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs-lint.yml"
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "logo/**"
      - "releasenotes/**"
      - ".markdownlint-cli2.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs-lint.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            test/e2e/go.sum
      - name: Validate dependency pins
        run: |
          jq -e '
            def image_pin(pin_name):
              ([.[] | select(.name == pin_name)] | length) == 1 and
              (.[] | select(.name == pin_name) |
                (.repository | test("^[a-z0-9][a-z0-9.-]*(:[0-9]+)?(/[a-z0-9][a-z0-9._-]*)+$")) and
                (.digest | test("^sha256:[0-9a-f]{64}$")));
            ([.[] | select(.name == "ZTUNNEL_REPO_SHA")] | length) == 1 and
            (.[] | select(.name == "ZTUNNEL_REPO_SHA") |
              (.repoName | test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")) and
              (.lastStableSHA | test("^[0-9a-f]{40}$"))) and
            image_pin("CNI_IMAGE") and
            image_pin("PROXY_INIT_IMAGE") and
            image_pin("GATEWAY_IMAGE")
          ' agentio.deps >/dev/null
      - name: Build agentiod
        run: make build
      - name: Run unit tests
        run: make test
      - name: Run linters and check new Go style findings
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${PUSH_BASE:-}}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          make lint GO_STYLE_BASE="$base"
          make lint.golangci GOLANGCI_LINT_ARGS="--new-from-rev=$base"
      - name: Run tests with the race detector
        run: make racetest

  gateway-runtime:
    strategy:
      matrix:
        runtime: [community, legacy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test gateway runtime
        run: ./bin/test_gateway_runtime.sh "" "${{ matrix.runtime }}"
