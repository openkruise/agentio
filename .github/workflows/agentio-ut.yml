name: agentio-ut

on:
  workflow_call:
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "logo/**"
      - "releasenotes/**"
      - ".markdownlint-cli2.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs-lint.yml"
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "logo/**"
      - "releasenotes/**"
      - ".markdownlint-cli2.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs-lint.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            test/e2e/go.sum
      - name: Validate dependency pins
        run: |
          jq -e '
            def image_pin(pin_name):
              ([.[] | select(.name == pin_name)] | length) == 1 and
              (.[] | select(.name == pin_name) |
                (.repository | test("^[a-z0-9][a-z0-9.-]*(:[0-9]+)?(/[a-z0-9][a-z0-9._-]*)+$")) and
                (.digest | test("^sha256:[0-9a-f]{64}$")));
            ([.[] | select(.name == "ZTUNNEL_REPO_SHA")] | length) == 1 and
            (.[] | select(.name == "ZTUNNEL_REPO_SHA") |
              (.repoName | test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")) and
              (.lastStableSHA | test("^[0-9a-f]{40}$"))) and
            image_pin("CNI_IMAGE") and
            image_pin("PROXY_INIT_IMAGE") and
            image_pin("GATEWAY_IMAGE") and
            image_pin("TRUST_PACKAGE_IMAGE")
          ' agentio.deps >/dev/null
      - name: Install Porter build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.0
      - name: Build Agentio binaries
        run: make build
      - name: Run unit tests
        run: make test
      - name: Test HTTP callout transport with the container Go toolchain
        env:
          GOTOOLCHAIN: go1.27.3 # Match extensions/epe/docker/Dockerfile.
        run: go test -race -count=30 -timeout=2m ./extensions/epe/pkg/extensionprovider -run '^TestHTTPCalloutTransportE2E$'
      - name: Run linters and check new Go style findings
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [[ -n "$PR_BASE" ]]; then
            # The merge ref may include a newer base than the event payload.
            base="$(git rev-parse HEAD^1)"
          else
            base="${PUSH_BASE:-}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          make lint GO_STYLE_BASE="$base"
          make lint.golangci GOLANGCI_LINT_ARGS="--new-from-rev=$base"
      - name: Run tests with the race detector
        run: make racetest

  sni-policy-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and unit test SNI policy module
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt
          rustup default 1.93.0
          bash extensions/envoy/sni-policy/build.sh

  network-limits-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and unit test network limits module
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.0
          cd extensions/envoy/network-limits
          bash build.sh
          cargo clippy --release --locked --all-targets -- -D warnings
      - name: Test CONNECT bandwidth and concurrency limits in Envoy
        run: |
          docker build --target runtime -t agentio-network-limits:test extensions/envoy/network-limits
          ./bin/test_network_limits.sh agentio-network-limits:test

      - name: Test scenario runner and network stability smoke profile
        run: |
          SCENARIO_TEST_IMAGE=agentio-network-limits:test go test -v ./bench/scenario
          go run ./bench/connect/scenarios \
            -image agentio-network-limits:test \
            -profile smoke \
            -output "$RUNNER_TEMP/network-limits-scenarios"
      - name: Upload network stability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-limits-scenarios
          path: ${{ runner.temp }}/network-limits-scenarios
          if-no-files-found: ignore

  gateway-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test gateway runtime
        run: ./bin/test_gateway_runtime.sh
