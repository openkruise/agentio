name: env-docs

on:
  pull_request:
    branches:
      - master
    paths:
      - "cmd/**"
      - "pkg/**"
      - "extensions/epe/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "tools/envdocs/**"
      - "docs/reference/agentiod-environment-variables.md"
      - "docs/reference/epe-configuration.md"
      - ".github/workflows/env-docs.yml"
  push:
    branches:
      - master
    paths:
      - "cmd/**"
      - "pkg/**"
      - "extensions/epe/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "tools/envdocs/**"
      - "docs/reference/agentiod-environment-variables.md"
      - "docs/reference/epe-configuration.md"
      - ".github/workflows/env-docs.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify environment reference tables
        run: make check.envdocs
