name: docs-lint

on:
  pull_request:
    branches:
      - master
      - "release-*"
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/docs-lint.yml"
  push:
    branches:
      - master
      - "release-*"
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/docs-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          config: .markdownlint-cli2.yaml
          globs: |
            README.md
            docs/**/*.md
            manifests/charts/**/*.md
            test/e2e/README.md
      - name: Check local links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          fail: true
          args: >-
            --offline
            --include-fragments
            --no-progress
            --root-dir "${{ github.workspace }}"
            README.md
            'docs/**/*.md'
            'manifests/charts/**/*.md'
            test/e2e/README.md
