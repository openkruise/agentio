name: agentio-product-e2e-presubmit

# Presubmit builds Agentio, pinned ztunnel source, and test fixtures locally.
# CNI and proxy-init images remain pinned by agentio.deps.
on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "logo/**"
      - "releasenotes/**"
      - ".markdownlint-cli2.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs-lint.yml"
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "logo/**"
      - "releasenotes/**"
      - ".markdownlint-cli2.yaml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs-lint.yml"

permissions:
  contents: read

concurrency:
  group: agentio-product-e2e-presubmit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-ztunnel:
    uses: ./.github/workflows/agentio-ztunnel.yml
    with:
      multi_arch: false
      cache_binary: true

  build-candidates:
    needs: build-ztunnel
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      cni_image: ${{ steps.bom.outputs.cni_image }}
      proxy_init_image: ${{ steps.bom.outputs.proxy_init_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download amd64 ztunnel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ztunnel-amd64
          path: ztunnel-context/amd64
      - name: Resolve external dependency BOM
        id: bom
        run: |
          resolve_pin() {
            local output_name="$1" pin_name="$2" repository digest
            repository=$(jq -er --arg name "$pin_name" '.[] | select(.name == $name) | .repository' agentio.deps)
            digest=$(jq -er --arg name "$pin_name" '.[] | select(.name == $name) | .digest' agentio.deps)
            if [[ ! "$repository" =~ ^[a-z0-9][a-z0-9.-]*(:[0-9]+)?(/[a-z0-9][a-z0-9._-]*)+$ ]] ||
               [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid immutable dependency pin $pin_name" >&2
              exit 1
            fi
            echo "${output_name}=${repository}@${digest}" >> "$GITHUB_OUTPUT"
          }
          resolve_pin cni_image CNI_IMAGE
          resolve_pin proxy_init_image PROXY_INIT_IMAGE
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build agentiod candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: agentio-e2e.local/agentiod:${{ github.sha }}
          cache-from: type=gha,scope=presubmit-agentiod-amd64
          cache-to: type=gha,scope=presubmit-agentiod-amd64,mode=max
      - name: Build agentio-epe candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: extensions/epe/docker/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: agentio-e2e.local/agentio-epe:${{ github.sha }}
          cache-from: type=gha,scope=presubmit-agentio-epe-amd64
          cache-to: type=gha,scope=presubmit-agentio-epe-amd64,mode=max
      - name: Build agentio-porter candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: extensions/porter/docker/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: agentio-e2e.local/agentio-porter:${{ github.sha }}
          cache-from: type=gha,scope=presubmit-agentio-porter-amd64
          cache-to: type=gha,scope=presubmit-agentio-porter-amd64,mode=max
      - name: Build agentio-gateway candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.gateway
          platforms: linux/amd64
          load: true
          provenance: false
          tags: agentio-e2e.local/agentio-gateway:${{ github.sha }}
          cache-from: type=gha,scope=presubmit-agentio-gateway-amd64
          cache-to: type=gha,scope=presubmit-agentio-gateway-amd64,mode=max
      - name: Build ext-proc candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: test/fixtures/extproc/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: agentio-e2e.local/ext-proc:${{ github.sha }}
          cache-from: type=gha,scope=presubmit-ext-proc-amd64
          cache-to: type=gha,scope=presubmit-ext-proc-amd64,mode=max
      - name: Build repository-owned and test fixture candidates
        env:
          ZTUNNEL_SOURCE_SHA: ${{ needs.build-ztunnel.outputs.source_sha }}
        run: |
          tag="$GITHUB_SHA"
          docker run --rm --read-only "agentio-e2e.local/agentio-porter:${tag}" --version
          ./bin/test_network_limits.sh "agentio-e2e.local/agentio-gateway:${tag}"
          docker build --file docker/Dockerfile.ztunnel \
            --build-arg TARGETARCH=amd64 \
            --build-arg "ZTUNNEL_VERSION=$ZTUNNEL_SOURCE_SHA" \
            --tag "agentio-e2e.local/ztunnel:${tag}" ztunnel-context
          docker save --output "${RUNNER_TEMP}/candidate-images.tar" \
            "agentio-e2e.local/agentiod:${tag}" \
            "agentio-e2e.local/agentio-epe:${tag}" \
            "agentio-e2e.local/agentio-porter:${tag}" \
            "agentio-e2e.local/agentio-gateway:${tag}" \
            "agentio-e2e.local/ext-proc:${tag}" \
            "agentio-e2e.local/ztunnel:${tag}"
      - name: Upload local candidate images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentio-presubmit-candidate-images
          path: ${{ runner.temp }}/candidate-images.tar
          if-no-files-found: error
          retention-days: 1

  product-e2e:
    needs: build-candidates
    uses: ./.github/workflows/agentio-e2e.yml
    with:
      candidate_image_artifact: agentio-presubmit-candidate-images
      cni_image: ${{ needs.build-candidates.outputs.cni_image }}
      proxy_init_image: ${{ needs.build-candidates.outputs.proxy_init_image }}
      gateway_image: "" # Resolved from the same-run candidate artifact.

  epe-e2e:
    needs: build-candidates
    uses: ./.github/workflows/agentio-e2e.yml
    with:
      epe_only: true
      candidate_image_artifact: agentio-presubmit-candidate-images
      proxy_init_image: ${{ needs.build-candidates.outputs.proxy_init_image }}
      gateway_image: "" # Resolved from the same-run candidate artifact.
