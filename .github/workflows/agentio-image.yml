name: agentio-image

# Agentio builds agentiod, EPE, the gateway agent and Porter, and pinned ztunnel source. Callers receive
# immutable references so the exact candidates tested by E2E can be promoted.
on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/docs-lint.yml"
  workflow_call:
    inputs:
      tag:
        description: Candidate image tag (up to 128 characters); defaults to the source commit SHA
        required: false
        default: ""
        type: string
    outputs:
      gateway_agent_image:
        description: Immutable community Envoy gateway image
        value: ${{ jobs.build-images.outputs.gateway_agent_image }}
      agentiod_image:
        description: Immutable agentiod image reference
        value: ${{ jobs.build-images.outputs.agentiod_image }}
      porter_image:
        description: Immutable Porter image reference
        value: ${{ jobs.build-images.outputs.porter_image }}
      epe_image:
        description: Immutable EPE image reference
        value: ${{ jobs.build-images.outputs.epe_image }}
      ztunnel_image:
        description: Immutable ztunnel image built from the pinned source
        value: ${{ jobs.build-images.outputs.ztunnel_image }}
    secrets:
      HUB_KRUISE:
        description: Docker Hub access token
        required: true

permissions:
  contents: read

env:
  HUB: docker.io/openkruise

concurrency:
  group: agentio-image-${{ inputs.tag != '' && inputs.tag || github.ref }}
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  build-ztunnel:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/agentio-ztunnel.yml

  build-owned:
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    environment: development
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [agentio-gateway, agentiod, agentio-epe, agentio-porter]
        include:
          - image: agentio-gateway
            dockerfile: docker/Dockerfile.gateway
          - image: agentiod
            dockerfile: Dockerfile
          - image: agentio-epe
            dockerfile: extensions/epe/docker/Dockerfile
          - image: agentio-porter
            dockerfile: extensions/porter/docker/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.HUB_KRUISE }}
      - name: Build and push native candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ env.HUB }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            AGENT_VERSION=${{ inputs.tag != '' && inputs.tag || github.sha }}
            AGENT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=publish-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=publish-${{ matrix.image }}-${{ matrix.arch }},mode=max
      - name: Smoke-test gateway agent candidate
        if: matrix.image == 'agentio-gateway'
        env:
          IMAGE: ${{ env.HUB }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: docker run --rm "$IMAGE" version
      - name: Smoke-test Porter candidate
        if: matrix.image == 'agentio-porter'
        env:
          IMAGE: ${{ env.HUB }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: docker run --rm --read-only "$IMAGE" --version
      - name: Record native digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve immutable digest for $IMAGE/$ARCH: $DIGEST" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          echo "$DIGEST" > "${RUNNER_TEMP}/digests/${IMAGE}-${ARCH}"
      - name: Upload native digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-images:
    needs: [build-ztunnel, build-owned]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: development
    outputs:
      gateway_agent_image: ${{ steps.images.outputs.gateway_agent_image }}
      agentiod_image: ${{ steps.images.outputs.agentiod_image }}
      epe_image: ${{ steps.images.outputs.epe_image }}
      porter_image: ${{ steps.images.outputs.porter_image }}
      ztunnel_image: ${{ steps.images.outputs.ztunnel_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download amd64 ztunnel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ztunnel-amd64
          path: ztunnel-context/amd64
      - name: Download arm64 ztunnel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ztunnel-arm64
          path: ztunnel-context/arm64
      - name: Download native image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - name: Resolve candidate tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            tag="$GITHUB_SHA"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid candidate tag (maximum 128 characters): $tag" >&2
            exit 1
          fi
          echo "CANDIDATE_TAG=$tag" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.HUB_KRUISE }}
      - name: Publish multi-platform candidates
        id: images
        env:
          INPUT_TAG: ${{ inputs.tag }}
          ZTUNNEL_SOURCE_SHA: ${{ needs.build-ztunnel.outputs.source_sha }}
          ZTUNNEL_SOURCE_REPOSITORY: ${{ needs.build-ztunnel.outputs.source_repository }}
        run: |
          build_image() {
            local output_name="$1" image_name="$2" dockerfile="$3" context="$4"
            shift 4
            local destination metadata digest
            destination="${HUB}/${image_name}:${CANDIDATE_TAG}"
            metadata="${RUNNER_TEMP}/${output_name}-metadata.json"
            tags=(--tag "$destination")
            if [[ -z "$INPUT_TAG" ]]; then
              tags+=(--tag "${HUB}/${image_name}:master-dev")
            fi
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --provenance=false \
              --file "$dockerfile" \
              --metadata-file "$metadata" \
              "${tags[@]}" \
              "$@" \
              --push \
              "$context"
            digest=$(jq -er '."containerimage.digest"' "$metadata")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Unable to resolve immutable digest for ${image_name}: $digest" >&2
              exit 1
            fi
            docker buildx imagetools inspect "${HUB}/${image_name}@${digest}" --raw |
              jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' >/dev/null
            echo "${output_name}=${HUB}/${image_name}@${digest}" >> "$GITHUB_OUTPUT"
          }

          merge_image() {
            local output_name="$1" image_name="$2" digest amd64 arm64
            local destination="${HUB}/${image_name}:${CANDIDATE_TAG}"
            local tags=(--tag "$destination")
            if [[ -z "$INPUT_TAG" ]]; then
              tags+=(--tag "${HUB}/${image_name}:master-dev")
            fi
            amd64=$(cat "${RUNNER_TEMP}/digests/${image_name}-amd64")
            arm64=$(cat "${RUNNER_TEMP}/digests/${image_name}-arm64")
            docker buildx imagetools create "${tags[@]}" \
              "${HUB}/${image_name}@${amd64}" \
              "${HUB}/${image_name}@${arm64}"
            digest=$(docker buildx imagetools inspect "$destination" --format '{{json .Manifest}}' | jq -er '.digest')
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Unable to resolve immutable digest for ${image_name}: $digest" >&2
              exit 1
            fi
            docker buildx imagetools inspect "${HUB}/${image_name}@${digest}" --raw |
              jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' >/dev/null
            echo "${output_name}=${HUB}/${image_name}@${digest}" >> "$GITHUB_OUTPUT"
          }

          merge_image gateway_agent_image agentio-gateway
          merge_image agentiod_image agentiod
          merge_image epe_image agentio-epe
          merge_image porter_image agentio-porter
          build_image ztunnel_image ztunnel docker/Dockerfile.ztunnel ztunnel-context \
            --build-arg "ZTUNNEL_VERSION=$ZTUNNEL_SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/${ZTUNNEL_SOURCE_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$ZTUNNEL_SOURCE_SHA"
      - name: Smoke-test gateway agent candidate
        env:
          GATEWAY_AGENT_IMAGE: ${{ steps.images.outputs.gateway_agent_image }}
        run: |
          docker run --rm "$GATEWAY_AGENT_IMAGE" version
