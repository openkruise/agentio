name: agentio-image

# Agentio builds agentiod, EPE, the opt-in gateway agent, and pinned ztunnel source. Callers receive
# immutable references so the exact candidates tested by E2E can be promoted.
on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/docs-lint.yml"
  workflow_call:
    inputs:
      tag:
        description: Candidate image tag (up to 121 characters); legacy gateway adds -legacy; defaults to the source commit SHA
        required: false
        default: ""
        type: string
    outputs:
      gateway_agent_image:
        description: Immutable opt-in community Envoy gateway image
        value: ${{ jobs.build-images.outputs.gateway_agent_image }}
      gateway_agent_legacy_image:
        description: Immutable opt-in legacy Envoy gateway image
        value: ${{ jobs.build-images.outputs.gateway_agent_legacy_image }}
      agentiod_image:
        description: Immutable agentiod image reference
        value: ${{ jobs.build-images.outputs.agentiod_image }}
      epe_image:
        description: Immutable EPE image reference
        value: ${{ jobs.build-images.outputs.epe_image }}
      ztunnel_image:
        description: Immutable ztunnel image built from the pinned source
        value: ${{ jobs.build-images.outputs.ztunnel_image }}
    secrets:
      HUB_KRUISE:
        description: Docker Hub access token
        required: true

permissions:
  contents: read

env:
  HUB: docker.io/openkruise

concurrency:
  group: agentio-image-${{ inputs.tag != '' && inputs.tag || github.ref }}
  cancel-in-progress: ${{ inputs.tag == '' }}

jobs:
  build-ztunnel:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/agentio-ztunnel.yml

  build-images:
    needs: build-ztunnel
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: development
    outputs:
      gateway_agent_image: ${{ steps.images.outputs.gateway_agent_image }}
      gateway_agent_legacy_image: ${{ steps.images.outputs.gateway_agent_legacy_image }}
      agentiod_image: ${{ steps.images.outputs.agentiod_image }}
      epe_image: ${{ steps.images.outputs.epe_image }}
      ztunnel_image: ${{ steps.images.outputs.ztunnel_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download amd64 ztunnel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ztunnel-amd64
          path: ztunnel-context/amd64
      - name: Download arm64 ztunnel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ztunnel-arm64
          path: ztunnel-context/arm64
      - name: Resolve candidate tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [[ -z "$tag" ]]; then
            tag="$GITHUB_SHA"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,120}$ ]]; then
            echo "Invalid candidate tag (maximum 121 characters to allow -legacy): $tag" >&2
            exit 1
          fi
          echo "CANDIDATE_TAG=$tag" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.HUB_KRUISE }}
      - name: Build and push owned candidates
        id: images
        env:
          INPUT_TAG: ${{ inputs.tag }}
          ZTUNNEL_SOURCE_SHA: ${{ needs.build-ztunnel.outputs.source_sha }}
          ZTUNNEL_SOURCE_REPOSITORY: ${{ needs.build-ztunnel.outputs.source_repository }}
        run: |
          build_image() {
            local output_name="$1" image_name="$2" dockerfile="$3" context="$4" tag_suffix="$5"
            shift 5
            local destination metadata digest
            destination="${HUB}/${image_name}:${CANDIDATE_TAG}${tag_suffix}"
            metadata="${RUNNER_TEMP}/${output_name}-metadata.json"
            tags=(--tag "$destination")
            if [[ -z "$INPUT_TAG" ]]; then
              tags+=(--tag "${HUB}/${image_name}:master-dev${tag_suffix}")
            fi
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --provenance=false \
              --file "$dockerfile" \
              --metadata-file "$metadata" \
              "${tags[@]}" \
              "$@" \
              --push \
              "$context"
            digest=$(jq -er '."containerimage.digest"' "$metadata")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Unable to resolve immutable digest for ${image_name}: $digest" >&2
              exit 1
            fi
            echo "${output_name}=${HUB}/${image_name}@${digest}" >> "$GITHUB_OUTPUT"
          }

          build_image gateway_agent_image agentio-gateway docker/Dockerfile.gateway . "" \
            --build-arg "AGENT_VERSION=$CANDIDATE_TAG" \
            --build-arg "AGENT_REVISION=$GITHUB_SHA"
          build_image gateway_agent_legacy_image agentio-gateway docker/Dockerfile.gateway . "-legacy" \
            --target legacy \
            --build-arg "AGENT_VERSION=$CANDIDATE_TAG" \
            --build-arg "AGENT_REVISION=$GITHUB_SHA"
          build_image agentiod_image agentiod Dockerfile . ""
          build_image epe_image agentio-epe extensions/epe/docker/Dockerfile . ""
          build_image ztunnel_image ztunnel docker/Dockerfile.ztunnel ztunnel-context "" \
            --build-arg "ZTUNNEL_VERSION=$ZTUNNEL_SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/${ZTUNNEL_SOURCE_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$ZTUNNEL_SOURCE_SHA"
      - name: Smoke-test gateway agent candidate
        env:
          GATEWAY_AGENT_IMAGE: ${{ steps.images.outputs.gateway_agent_image }}
          GATEWAY_AGENT_LEGACY_IMAGE: ${{ steps.images.outputs.gateway_agent_legacy_image }}
        run: |
          docker run --rm "$GATEWAY_AGENT_IMAGE" version
          docker run --rm "$GATEWAY_AGENT_LEGACY_IMAGE" version
