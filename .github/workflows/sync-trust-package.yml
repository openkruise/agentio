name: Sync public CA package

on:
  schedule:
    - cron: "17 1 * * *" # 09:17 Asia/Shanghai
  workflow_dispatch:
    inputs:
      dry_run:
        description: Resolve and validate the CA update without opening a pull request
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-trust-package
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'openkruise/agentio' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Update public CA package
        id: update
        shell: bash
        run: |
          index=$(curl -fsSL https://curl.se/docs/caextract.html)
          path=$(printf '%s\n' "$index" | grep -Eo '/ca/cacert-[0-9]{4}-[0-9]{2}-[0-9]{2}[.]pem' | LC_ALL=C sort | tail -n 1)
          url="https://curl.se$path"
          bundle="${RUNNER_TEMP}/${path##*/}"
          checksum=$(curl -fsSL "$url.sha256")
          read -r hash _ <<< "$checksum"
          if [[ ! "$hash" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid public CA bundle checksum: $hash" >&2
            exit 1
          fi
          curl -fsSL "$url" -o "$bundle"
          printf '%s  %s\n' "$hash" "$bundle" | sha256sum -c -
          digest="sha256:$hash"
          jq --arg url "$url" --arg digest "$digest" \
            'map(if .name == "PUBLIC_CA_BUNDLE" then .url = $url | .digest = $digest else . end)' \
            agentio.deps > agentio.deps.next
          mv agentio.deps.next agentio.deps
          sed "s|^ADD --checksum=sha256:.* https://curl[.]se/ca/cacert-.*[.]pem /tmp/$|ADD --checksum=$digest $url /tmp/|" Dockerfile > Dockerfile.next
          mv Dockerfile.next Dockerfile
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
      - name: Validate CA build pin and package
        env:
          BUNDLE: ${{ steps.update.outputs.bundle }}
        run: |
          go test ./internal/ci -run '^TestTrustPackagePin$' -count=1
          go run ./tools/public-ca-package "$BUNDLE" > /dev/null
      - name: Create GitHub App token
        if: inputs.dry_run != true
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENTIO_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIO_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create or update CA pull request
        if: inputs.dry_run != true
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: master
          branch: codex/trust-package-image
          delete-branch: true
          add-paths: |
            agentio.deps
            Dockerfile
          commit-message: "deps: update public CA package"
          title: "deps: update public CA package"
          body: |
            Updates the public CA package embedded in Agentiod, keeping the BOM and Dockerfile synchronized.

            - Mozilla CA snapshot: ${{ steps.update.outputs.url }}
            - Existing presubmit builds and product E2E validate the candidate before merge.
