name: agentio-product-e2e

# Product E2E consumes an immutable release BOM or same-run local candidates.
# Every profile/backend scenario has an isolated cluster so CNI and firewall
# state never crosses matrix entries.
on:
  workflow_call:
    inputs:
      candidate_image_artifact:
        description: Optional same-run artifact containing local agentiod, EPE, and ext-proc images
        required: false
        default: ""
        type: string
      agentiod_image:
        description: Immutable agentiod image (repository@sha256:digest)
        required: false
        default: ""
        type: string
      epe_image:
        description: Immutable EPE image (repository@sha256:digest)
        required: false
        default: ""
        type: string
      cni_image:
        description: Immutable CNI image (repository@sha256:digest)
        required: true
        type: string
      ztunnel_image:
        description: Immutable ztunnel image (repository@sha256:digest)
        required: true
        type: string
      proxy_init_image:
        description: Immutable proxy-init image (repository@sha256:digest)
        required: true
        type: string
      gateway_image:
        description: Immutable gateway/proxyv2 image (repository@sha256:digest)
        required: true
        type: string
      ext_proc_image:
        description: Immutable ext-proc fixture image (repository@sha256:digest)
        required: false
        default: ""
        type: string
      forward_proxy_image:
        description: Optional immutable forward-proxy fixture override
        required: false
        default: ""
        type: string
      chart_artifact:
        description: Optional same-run artifact containing the prepared chart
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      agentiod_image:
        description: Immutable agentiod image (repository@sha256:digest)
        required: true
        type: string
      epe_image:
        description: Immutable EPE image (repository@sha256:digest)
        required: true
        type: string
      cni_image:
        description: Immutable CNI image (repository@sha256:digest)
        required: true
        type: string
      ztunnel_image:
        description: Immutable ztunnel image (repository@sha256:digest)
        required: true
        type: string
      proxy_init_image:
        description: Immutable proxy-init image (repository@sha256:digest)
        required: true
        type: string
      gateway_image:
        description: Immutable gateway/proxyv2 image (repository@sha256:digest)
        required: true
        type: string
      ext_proc_image:
        description: Immutable ext-proc fixture image (repository@sha256:digest)
        required: true
        type: string
      forward_proxy_image:
        description: Optional immutable forward-proxy fixture override
        required: false
        default: ""
        type: string
      chart_artifact:
        description: Internal same-run chart artifact; leave empty for manual runs
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: agentio-product-e2e-${{ github.run_id }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.coverage.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: test/e2e/go.mod
          cache-dependency-path: test/e2e/go.sum
      - name: Generate product coverage plan
        id: coverage
        run: |
          matrix=$(go -C test/e2e run ./cmd/product-e2e plan --format=json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-client-trust-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build client trust fixture
        run: |
          docker build --file test/fixtures/clienttrust/Dockerfile \
            --tag "agentio-e2e.local/clienttrust:${GITHUB_SHA}" .
          docker save --output "${RUNNER_TEMP}/clienttrust-image.tar" \
            "agentio-e2e.local/clienttrust:${GITHUB_SHA}"
      - name: Upload client trust fixture
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agentio-clienttrust-fixture
          path: ${{ runner.temp }}/clienttrust-image.tar
          if-no-files-found: error
          retention-days: 1

  product-e2e:
    needs: [plan, build-client-trust-fixture]
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      E2E_CLUSTER_NAME: ${{ matrix.cluster }}
      E2E_REGISTRY_NAME: ${{ matrix.cluster }}-registry
      E2E_CLUSTER_REUSE: "true"
      E2E_LIFECYCLE_RETAIN: never
      E2E_DIAGNOSTICS_FULL_ON_FAILURE: "true"
      E2E_DIAGNOSTICS_MAX_FULL_DUMPS: "1"
      AGENTIO_E2E_PROFILE: ${{ matrix.profile }}
      AGENTIO_E2E_GROUP: ${{ matrix.id }}
      AGENTIO_E2E_AGENTIOD_IMAGE: ${{ inputs.agentiod_image }}
      AGENTIO_E2E_EPE_IMAGE: ${{ inputs.epe_image }}
      AGENTIO_E2E_CNI_IMAGE: ${{ inputs.cni_image }}
      AGENTIO_E2E_ZTUNNEL_IMAGE: ${{ inputs.ztunnel_image }}
      AGENTIO_E2E_PROXY_INIT_IMAGE: ${{ inputs.proxy_init_image }}
      AGENTIO_E2E_GATEWAY_IMAGE: ${{ inputs.gateway_image }}
      AGENTIO_E2E_EXT_PROC_IMAGE: ${{ inputs.ext_proc_image }}
      AGENTIO_E2E_FORWARD_PROXY_IMAGE: ${{ inputs.forward_proxy_image }}
      AGENTIO_E2E_ENABLE_FIREWALL_RULES: "true"
      AGENTIO_E2E_FIREWALL_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure scenario artifact directory
        env:
          SCENARIO: ${{ matrix.id }}
        run: echo "E2E_ARTIFACTS_DIR=${RUNNER_TEMP}/agentio-${SCENARIO}-e2e-artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            test/e2e/go.sum
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.31.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.2
      - name: Install KinD
        run: |
          go install sigs.k8s.io/kind@v0.24.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Download client trust fixture
        if: contains(matrix.fixtures, 'clienttrust')
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: agentio-clienttrust-fixture
          path: ${{ runner.temp }}/agentio-clienttrust-fixture
      - name: Start local image registry
        if: inputs.candidate_image_artifact != '' || contains(matrix.fixtures, 'clienttrust')
        run: |
          docker run -d --restart=always \
            -p 127.0.0.1:5001:5000 \
            --name "$E2E_REGISTRY_NAME" \
            registry:2.8.3
          kind_config="${RUNNER_TEMP}/agentio-kind-registry.yaml"
          cat >"$kind_config" <<EOF
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          containerdConfigPatches:
          - |-
            [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5001"]
              endpoint = ["http://${E2E_REGISTRY_NAME}:5000"]
          EOF
          echo "E2E_KIND_CONFIG=$kind_config" >> "$GITHUB_ENV"
      - name: Publish client trust fixture to local registry
        if: contains(matrix.fixtures, 'clienttrust')
        run: |
          docker load --input "${RUNNER_TEMP}/agentio-clienttrust-fixture/clienttrust-image.tar"
          target="localhost:5001/clienttrust:${GITHUB_SHA}"
          docker tag "agentio-e2e.local/clienttrust:${GITHUB_SHA}" "$target"
          docker push "$target"
          digest_ref=$(docker image inspect "$target" --format '{{range .RepoDigests}}{{println .}}{{end}}' |
            grep -m 1 -E '^localhost:5001/clienttrust@sha256:[0-9a-f]{64}$')
          test -n "$digest_ref"
          echo "AGENTIO_E2E_CLIENT_TRUST_IMAGE=$digest_ref" >> "$GITHUB_ENV"
      - name: Download local candidate images
        if: inputs.candidate_image_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.candidate_image_artifact }}
          path: ${{ runner.temp }}/agentio-candidate-images
      - name: Publish candidates to a local registry
        if: inputs.candidate_image_artifact != ''
        run: |
          archive="${RUNNER_TEMP}/agentio-candidate-images/candidate-images.tar"
          if [[ ! -f "$archive" ]]; then
            echo "Candidate image artifact does not contain candidate-images.tar" >&2
            exit 1
          fi
          docker load --input "$archive"

          for image in agentiod agentio-epe ext-proc; do
            source="agentio-e2e.local/${image}:${GITHUB_SHA}"
            target="localhost:5001/${image}:${GITHUB_SHA}"
            docker image inspect "$source" >/dev/null
            docker tag "$source" "$target"
            docker push "$target"
            digest_ref=$(docker image inspect "$target" --format '{{range .RepoDigests}}{{println .}}{{end}}' |
              grep -m 1 -E "^localhost:5001/${image}@sha256:[0-9a-f]{64}$")
            if [[ -z "$digest_ref" ]]; then
              echo "Unable to resolve local digest for $target" >&2
              exit 1
            fi
            case "$image" in
              agentiod) echo "AGENTIO_E2E_AGENTIOD_IMAGE=$digest_ref" >> "$GITHUB_ENV" ;;
              agentio-epe) echo "AGENTIO_E2E_EPE_IMAGE=$digest_ref" >> "$GITHUB_ENV" ;;
              ext-proc) echo "AGENTIO_E2E_EXT_PROC_IMAGE=$digest_ref" >> "$GITHUB_ENV" ;;
            esac
          done
      - name: Download prepared release chart
        if: inputs.chart_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.chart_artifact }}
          path: ${{ runner.temp }}/agentio-candidate-chart
      - name: Select prepared release chart
        if: inputs.chart_artifact != ''
        run: |
          chart_path="${RUNNER_TEMP}/agentio-candidate-chart"
          if [[ ! -f "${chart_path}/Chart.yaml" ]]; then
            echo "Prepared chart artifact does not contain Chart.yaml" >&2
            exit 1
          fi
          echo "AGENTIO_E2E_CHART_PATH=$chart_path" >> "$GITHUB_ENV"
      - name: Create isolated KinD cluster
        run: |
          args=(create cluster --name "$E2E_CLUSTER_NAME")
          if [[ -n "${E2E_KIND_CONFIG:-}" ]]; then
            args+=(--config "$E2E_KIND_CONFIG")
          fi
          kind "${args[@]}"
          if [[ -n "${E2E_KIND_CONFIG:-}" ]]; then
            docker network connect kind "$E2E_REGISTRY_NAME"
          fi
      - name: Run Agentio ${{ matrix.id }} product E2E
        run: make test.integration.agentio.product
      - name: Export KinD logs
        if: always()
        run: kind export logs --name "$E2E_CLUSTER_NAME" "$E2E_ARTIFACTS_DIR/kind" || true
      - name: Upload Agentio E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentio-${{ matrix.id }}-e2e-artifacts
          path: ${{ runner.temp }}/agentio-${{ matrix.id }}-e2e-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Delete isolated KinD cluster
        if: always()
        run: |
          kind delete cluster --name "$E2E_CLUSTER_NAME"
          if kind get clusters | grep -Fxq "$E2E_CLUSTER_NAME"; then
            echo "KinD cluster $E2E_CLUSTER_NAME still exists after deletion" >&2
            exit 1
          fi
      - name: Delete local image registry
        if: always() && (inputs.candidate_image_artifact != '' || contains(matrix.fixtures, 'clienttrust'))
        run: docker rm --force "$E2E_REGISTRY_NAME" || true
