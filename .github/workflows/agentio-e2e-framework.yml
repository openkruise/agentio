name: agentio-e2e-framework

# Fast repository-owned KinD smoke coverage. Product behavior is gated by the
# immutable-BOM workflow in agentio-e2e.yml during release.
on:
  pull_request:
    branches:
      - master
    paths:
      - "test/e2e/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/agentio-e2e-framework.yml"
  push:
    branches:
      - master
    paths:
      - "test/e2e/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/agentio-e2e-framework.yml"

permissions:
  contents: read

concurrency:
  group: agentio-e2e-framework-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  framework-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            test/e2e/go.sum
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.31.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.2
      - name: Install KinD
        run: |
          go install sigs.k8s.io/kind@v0.24.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run Agentio E2E framework smoke test
        env:
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/agentio-e2e-framework-artifacts
          E2E_LIFECYCLE_RETAIN: never
        run: make test.integration.agentio.kube
      - name: Upload framework artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentio-e2e-framework-artifacts
          path: ${{ runner.temp }}/agentio-e2e-framework-artifacts
          if-no-files-found: warn
          retention-days: 7
