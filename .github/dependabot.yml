version: 2

updates:
  - package-ecosystem: docker
    directories:
      - /
      - /docker
      - /extensions/epe/docker
      - /extensions/porter/docker
      - /extensions/envoy/connection-policy
      - /test/fixtures/clienttrust
      - /test/fixtures/extproc
      - /bench/xds
      - /bench/porter
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      docker-images:
        patterns:
          - "*"
    ignore:
      # Debian CA package revisions need their own comparator and BOM synchronization.
      - dependency-name: quay.io/jetstack/trust-pkg-debian-bookworm

  - package-ecosystem: gomod
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      # Match coupled dependencies first; other minor/major updates get individual PRs.
      root-go-kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/controller-runtime"
      root-go-istio:
        patterns:
          - "istio.io/*"
      root-go-patches:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: gomod
    directory: /test/e2e
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      # Keep the same grouping policy as the root Go module.
      e2e-go-kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/controller-runtime"
      e2e-go-istio:
        patterns:
          - "istio.io/*"
      e2e-go-patches:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      github-actions:
        patterns:
          - "*"
