// Wire projection of Delta ADS, following ztunnel/proto/xds.proto. Unused
// fields are intentionally omitted; field numbers and service paths are stable.
syntax = "proto3";
package envoy.service.discovery.v3;
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/duration.proto";
message Node { string id = 1; google.protobuf.Struct metadata = 3; }
message Status { int32 code = 1; string message = 2; }
message DeltaDiscoveryRequest {
  Node node = 1;
  string type_url = 2;
  repeated string resource_names_subscribe = 3;
  repeated string resource_names_unsubscribe = 4;
  map<string,string> initial_resource_versions = 5;
  string response_nonce = 6;
  Status error_detail = 7;
}
message DeltaDiscoveryResponse {
  string system_version_info = 1;
  repeated Resource resources = 2;
  string type_url = 4;
  string nonce = 5;
  repeated string removed_resources = 6;
}
message Resource {
  string version = 1;
  google.protobuf.Any resource = 2;
  string name = 3;
  repeated string aliases = 4;
  google.protobuf.Duration ttl = 6;
}
service AggregatedDiscoveryService {
  rpc DeltaAggregatedResources(stream DeltaDiscoveryRequest) returns (stream DeltaDiscoveryResponse);
}
