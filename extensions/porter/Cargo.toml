[package]
name = "agentio-porter"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
anyhow = "1"
axum = "0.8"
async-stream = "0.3"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
humantime = "2"
lru = "0.16"
percent-encoding = "2"
prost = "0.14"
prost-types = "0.14"
prometheus-client = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.9"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
x509-parser = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.6"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
