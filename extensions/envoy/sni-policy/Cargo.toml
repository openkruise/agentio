[package]
name = "agentio-envoy-sni-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[lib]
name = "envoy_agentio_sni_policy"
crate-type = ["cdylib"]

[dependencies]
# build.sh extracts the pinned SDK here without cloning the entire Envoy repository.
envoy-proxy-dynamic-modules-rust-sdk = { path = ".envoy-sdk/source/extensions/dynamic_modules/sdk/rust" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
envoy-proxy-dynamic-modules-rust-sdk = { path = ".envoy-sdk/source/extensions/dynamic_modules/sdk/rust", features = ["mock"] }

[workspace]
