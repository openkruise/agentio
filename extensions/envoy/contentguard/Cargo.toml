[package]
name = "agentio-envoy-contentguard"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
publish = false

[lib]
name = "envoy_agentio_contentguard"
crate-type = ["cdylib"]

[dependencies]
envoy-proxy-dynamic-modules-rust-sdk = { path = ".envoy-sdk/source/extensions/dynamic_modules/sdk/rust" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mime = "0.3"
memchr = "2"
base64 = "0.22"

[workspace]
