profile: sidecar

global:
  hub: docker.io/openkruise
  tag: latest
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  clusterId: Kubernetes
  trustDomain: cluster.local
  clusterDomain: cluster.local
  caCertConfigMap: agentio-ca-certs

agentiod:
  nameOverride: agentiod
  fullnameOverride: ""
  replicaCount: 1
  image:
    repository: ""
    name: agentiod
    tag: ""
    digest: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  service:
    annotations: {}
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  rollingUpdate:
    maxSurge: 100%
    maxUnavailable: 25%
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  podLabels: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 1337
    runAsGroup: 1337
    fsGroup: 1337
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  tokenAudience: agentio-ca
  logging:
    level: info
    format: text
  keepalive:
    # Set to 0s to disable periodic server-side gRPC connection expiry.
    maxServerConnectionAge: 30m
  trustedNodeServiceAccount: ztunnel
  enableDebugOnHTTP: true
  meshInternalTrafficPolicy: PEER_AWARE
  enableSNITrafficPolicy: false
  ca:
    secretName: agentio-ca-secret
    configMapName: ""
    leaseName: agentiod-ca-leader
    trustBundleConfigMapName: agentio-ca-root-cert
    trustBundleLeaseName: agentiod-trust-bundle-leader
  mitm:
    secretName: agentio-mitm-ca
    secretNamespace: ""
    signMode: SELF_SIGN
  config:
    name: agentio-config
    primaryName: agentio-config-primary
    values: {}
    sourcesName: agentio-config-sources
    sources: ""
  # Upstream trust-manager Debian package, 20250419~deb12u1.1. Pin updates by digest.
  # Prepared automatically when client trust is enabled and sources include defaultCAs.
  trustPackage:
    image: "quay.io/jetstack/trust-pkg-debian-bookworm@sha256:36d3128ce4661ee863bfe0dac12826b092c14eb0a88f8242e60a1fad4c806acd"
  clientTrustBundle:
    # Store CA sources in the Agentio system namespace with the default RBAC.
    # References require namespace/name/key; sources do not grant additional Secret permissions.
    sources:
      - defaultCAs: true
      - agentioMITM: true
    target:
      configMapName: agentio-client-ca
      key: ca-bundle.pem
  injector:
    clientTrust:
      # Master switch for client CA distribution and injection.
      # The public CA package init is included when sources select defaultCAs.
      # Pod annotations can opt out, but cannot enable this feature when disabled here.
      # Independent of Gateway TLS termination and SNI traffic policy configuration.
      enabled: false
      containers:
        include: []
        exclude: []
        includeInitContainers: false
      # Omit mounts/files to use the automatically distributed bundle.
      # Custom mounts require explicit items and files.caBundle.
      # AGENTIO_TRUST_BUNDLE is always injected with the CA bundle path.
      # These additional names receive the same path; use [] to omit them.
      env:
        # Python ssl / HTTPX and clients using OpenSSL default trust paths.
        - SSL_CERT_FILE
        # Python Requests.
        - REQUESTS_CA_BUNDLE
        # Node.js: adds trust alongside built-in public roots.
        - NODE_EXTRA_CA_CERTS
        # curl.
        - CURL_CA_BUNDLE
      envConflictPolicy: Preserve
    configMapName: agentio-sidecar-injector
    webhookName: ""
    nativeSidecars: auto
    failurePolicy: Fail
    reinvocationPolicy: Never
    ztunnel:
      image: ""
      imageName: ztunnel
      enableFirewallRules: true
      firewallBackend: auto
    proxyInit:
      image: ""
      imageName: proxy-init
  gatewayDeployer:
    leaseName: agentiod-gateway-deployer-leader
  networkPolicy:
    enabled: false
  # AGENTIO_SANDBOX_MODE also configures injected and ambient ztunnel discovery.
  # Set it to "true" and AGENTIO_SANDBOX_RUNTIMES to "kruise" for runtime Sandboxes.
  env: {}

cni:
  nameOverride: agentio-cni
  fullnameOverride: ""
  image:
    repository: ""
    name: install-cni
    tag: ""
    digest: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  cniBinDir: /opt/cni/bin
  cniConfDir: /etc/cni/net.d
  cniConfFileName: ""
  cniNetnsDir: /var/run/netns
  chained: true
  shareHostNetworkNamespace: false
  excludeNamespaces:
    - kube-system
    - agentio-system
  # Existing Multus NetworkAttachmentDefinition, used by injection with the multus provider.
  networkName: default/agentio-cni
  dnsCapture: true
  ipv6: true
  reconcileIptablesOnStartup: true
  enablementSelector:
    - podSelector:
        matchLabels:
          agentio.kruise.io/dataplane-mode: ambient
    - podSelector:
        matchExpressions:
          - key: agentio.kruise.io/dataplane-mode
            operator: NotIn
            values: [none]
      namespaceSelector:
        matchLabels:
          agentio.kruise.io/dataplane-mode: ambient
  repair:
    enabled: true
    repairPods: true
    labelPods: false
    deletePods: false
    initContainerName: agentio-validation
    brokenPodLabelKey: cni.istio.io/uninitialized
    brokenPodLabelValue: "true"
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - operator: Exists
      effect: NoSchedule
    - operator: Exists
      effect: NoExecute
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  terminationGracePeriodSeconds: 30
  podAnnotations: {}
  podLabels: {}
  networkPolicy:
    enabled: false

ztunnel:
  nameOverride: ztunnel
  fullnameOverride: ""
  image:
    repository: ""
    name: ztunnel
    tag: ""
    digest: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  tokenAudience: agentio-ca
  trustBundle:
    useClusterTrustBundle: false
    clusterTrustBundleName: agentio-ca-root-cert
  enableFirewallRules: true
  logLevel: info
  logAsJson: true
  env: {}
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - operator: Exists
      effect: NoSchedule
    - operator: Exists
      effect: NoExecute
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  terminationGracePeriodSeconds: 30
  podAnnotations: {}
  podLabels: {}
  networkPolicy:
    enabled: false
  platform: ""

egressGateway:
  mode: disabled
  # Used only by gatewaydeployer for the agentio-agentgateway GatewayClass.
  # Native file configuration comes from the Gateway's parametersRef ConfigMap.
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.5.0
    # Enable the native CA client using Agentiod's address, trust bundle,
    # token audience and the Gateway Pod's ServiceAccount identity.
    # Native config must use tunnelProtocol: hboneGateway for HBONE termination.
    ca:
      enabled: false
    terminationGracePeriodSeconds: 30
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "2", memory: 1Gi}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
  nameOverride: agentio-egress
  fullnameOverride: ""
  image:
    repository: ""
    name: proxyv2
    tag: ""
    digest: ""
  tokenAudience: agentio-ca
  replicaCount: 2
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  rbac:
    readSecrets: false
  service:
    type: ClusterIP
    annotations: {}
    ports:
      status: 15021
      mesh: 15008
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  terminationGracePeriodSeconds: 30
  statsFlushInterval: ""
  statsEvictionInterval: ""
  sniTrafficPolicy:
    enabled: false
  env: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  networkPolicy:
    enabled: false
  gatewayAPI:
    create: false
    name: agentio-egress
    gatewayClassName: agentio-egress
    infrastructure: {}
    annotations: {}
    labels: {}
    listeners:
      - name: mesh
        port: 15008
        protocol: HBONE

epe:
  # EPE always watches <epe-name>-config and <epe-name>-config-primary in its namespace.
  # Set config to have Helm create EPEConfig with extensionProviders and defaultProviders.
  # null leaves the base externally managed; primary is always externally managed.
  # Providers merge by name across environment defaults, base, and primary.
  # The environment provider is named agentio-default-credential-provider.
  config: null
  mode: disabled
  nameOverride: agentio-epe
  fullnameOverride: ""
  image:
    repository: ""
    name: agentio-epe
    tag: ""
    digest: ""
  replicaCount: 1
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  service:
    grpcPort: 9002
    healthPort: 9003
    metricsPort: 9090
  external:
    address: ""
    port: 9002
  messageTimeout: 5s
  tls:
    # Enable workload mTLS between the gateway and EPE.
    enabled: false
    # Managed EPE only. Enabling TLS is sufficient to request and renew certificates
    # from this chart's Agentiod; certificateSource can be omitted or left as {}.
    # The CA address follows Agentiod's Service name, namespace and global.clusterDomain.
    # The chart mounts roots from agentiod.ca.trustBundleConfigMapName and projects
    # an EPE ServiceAccount token using agentiod.tokenAudience.
    # Select at most one of ca or file. Configure custom mounts below.
    certificateSource: {}
    # certificateSource:
    #   ca:
    #     address: ca.example:15012
    #     tokenFile: /custom/token
    #     caCertificateFile: /custom/root.pem
    # Set only the CA fields you need to override; omitted fields keep these defaults.
    # Explicit tokenFile/caCertificateFile paths disable their automatic mounts.
    # certificateSource:
    #   file:
    #     certificateFile: /etc/epe/tls/tls.crt
    #     privateKeyFile: /etc/epe/tls/tls.key
    #     caCertificateFile: /etc/epe/trust/ca.crt
    # EPE identities accepted by the gateway. Managed mode defaults to EPE's SA.
    # External mode requires an explicit list.
    peerSpiffeIDs: []
  credentialProvider:
    url: ""
    mtls:
      source: none
      secret:
        namespace: ""
        name: ""
      insecureSkipVerify: false
  tokenCacheTTL: 15m
  tokenCacheMaxSize: 10000
  auditWebhook:
    insecureSkipVerify: false
  env: {}
  # Native Kubernetes volumes and mounts, also available when TLS is disabled.
  # Mount certificate directories without subPath to receive projected updates.
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  networkPolicy:
    enabled: false
