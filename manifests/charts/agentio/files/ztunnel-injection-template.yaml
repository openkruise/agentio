{{- $sandboxEnabled := eq (printf "%v" (default false .Values.global.proxyZtunnel.sandboxMode)) "true" -}}
{{- $interception := (annotation .ObjectMeta `sidecar.agentio.kruise.io/interception-mode` .ProxyConfig.InterceptionMode) -}}

{{- define "resources"  }}
  {{- if or (isset .ObjectMeta.Annotations `sidecar.agentio.kruise.io/proxy-cpu`) (isset .ObjectMeta.Annotations `sidecar.agentio.kruise.io/proxy-memory`) (isset .ObjectMeta.Annotations `sidecar.agentio.kruise.io/proxy-cpu-limit`) (isset .ObjectMeta.Annotations `sidecar.agentio.kruise.io/proxy-memory-limit`) }}
    {{- if or (isset .ObjectMeta.Annotations `sidecar.agentio.kruise.io/proxy-cpu`) (isset .ObjectMeta.Annotations `sidecar.agentio.kruise.io/proxy-memory`) }}
      requests:
        {{ if (isset .ObjectMeta.Annotations `sidecar.agentio.kruise.io/proxy-cpu`) -}}
        cpu: {{ index .ObjectMeta.Annotations `sidecar.agentio.kruise.io/proxy-cpu` | quote }}
        {{ end }}
        {{ if (isset .ObjectMeta.Annotations `sidecar.agentio.kruise.io/proxy-memory`) -}}
        memory: {{ index .ObjectMeta.Annotations `sidecar.agentio.kruise.io/proxy-memory` | quote }}
        {{ end }}
    {{- end }}
    {{- if or (isset .ObjectMeta.Annotations `sidecar.agentio.kruise.io/proxy-cpu-limit`) (isset .ObjectMeta.Annotations `sidecar.agentio.kruise.io/proxy-memory-limit`) }}
      limits:
        {{ if (isset .ObjectMeta.Annotations `sidecar.agentio.kruise.io/proxy-cpu-limit`) -}}
        cpu: {{ index .ObjectMeta.Annotations `sidecar.agentio.kruise.io/proxy-cpu-limit` | quote }}
        {{ end }}
        {{ if (isset .ObjectMeta.Annotations `sidecar.agentio.kruise.io/proxy-memory-limit`) -}}
        memory: {{ index .ObjectMeta.Annotations `sidecar.agentio.kruise.io/proxy-memory-limit` | quote }}
        {{ end }}
    {{- end }}
  {{- else }}
    {{- if .Values.global.proxy.resources }}
      {{ toYaml (omitNil .Values.global.proxy.resources) | indent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
{{ $nativeSidecar := ne (index .ObjectMeta.Annotations `sidecar.agentio.kruise.io/native-sidecar` | default (printf "%t" .NativeSidecars)) "false" }}
{{- $proxyContainerName := proxyContainerName .Spec }}
{{- $containers := list }}
{{- range $index, $container := .Spec.Containers }}{{ if not (isProxyContainerName $container.Name) }}{{ $containers = append $containers $container.Name }}{{end}}{{- end}}
metadata:
{{ if .Values.podLabels }}
  labels:
{{ toYaml .Values.podLabels | indent 4 }}
{{ end }}
  annotations: {
    {{- if ge (len $containers) 1 }}
    {{- if not (isset .ObjectMeta.Annotations `kubectl.kubernetes.io/default-logs-container`) }}
    kubectl.kubernetes.io/default-logs-container: "{{ index $containers 0 }}",
    {{- end }}
    {{- if not (isset .ObjectMeta.Annotations `kubectl.kubernetes.io/default-container`) }}
    kubectl.kubernetes.io/default-container: "{{ index $containers 0 }}",
    {{- end }}
    {{- end }}
{{- if .Values.pilot.cni.enabled }}
    {{- if eq .Values.pilot.cni.provider "multus" }}
    k8s.v1.cni.cncf.io/networks : '{{ appendMultusNetwork (index .ObjectMeta.Annotations `k8s.v1.cni.cncf.io/networks`) (.Values.pilot.cni.networkName | default "default/agentio-cni") }}',
    {{- end }}
    {{ with annotation .ObjectMeta `traffic.sidecar.agentio.kruise.io/include-outbound-ip-ranges` .Values.global.proxy.includeIPRanges }}traffic.sidecar.istio.io/includeOutboundIPRanges: "{{.}}",{{ end }}
    {{ with annotation .ObjectMeta `traffic.sidecar.agentio.kruise.io/exclude-outbound-ip-ranges` .Values.global.proxy.excludeIPRanges }}traffic.sidecar.istio.io/excludeOutboundIPRanges: "{{.}}",{{ end }}
    traffic.sidecar.istio.io/includeInboundPorts: "{{ annotation .ObjectMeta `traffic.sidecar.agentio.kruise.io/include-inbound-ports` .Values.global.proxy.includeInboundPorts }}",
    traffic.sidecar.istio.io/excludeInboundPorts: "{{ excludeInboundPort (annotation .ObjectMeta `sidecar.agentio.kruise.io/status-port` .Values.global.proxy.statusPort) (annotation .ObjectMeta `traffic.sidecar.agentio.kruise.io/exclude-inbound-ports` .Values.global.proxy.excludeInboundPorts) }}",
    {{ if or (isset .ObjectMeta.Annotations `traffic.sidecar.agentio.kruise.io/include-outbound-ports`) (ne (valueOrDefault .Values.global.proxy.includeOutboundPorts "") "") }}
    traffic.sidecar.istio.io/includeOutboundPorts: "{{ annotation .ObjectMeta `traffic.sidecar.agentio.kruise.io/include-outbound-ports` .Values.global.proxy.includeOutboundPorts }}",
    {{- end }}
    {{ if or (isset .ObjectMeta.Annotations `traffic.sidecar.agentio.kruise.io/exclude-outbound-ports`) (ne .Values.global.proxy.excludeOutboundPorts "") }}
    traffic.sidecar.istio.io/excludeOutboundPorts: "{{ annotation .ObjectMeta `traffic.sidecar.agentio.kruise.io/exclude-outbound-ports` .Values.global.proxy.excludeOutboundPorts }}",
    {{- end }}
    {{ with index .ObjectMeta.Annotations `traffic.sidecar.agentio.kruise.io/kubevirt-interfaces` }}traffic.sidecar.istio.io/kubevirtInterfaces: "{{.}}",{{ end }}
    {{ with index .ObjectMeta.Annotations `traffic.sidecar.agentio.kruise.io/reroute-virtual-interfaces` }}istio.io/reroute-virtual-interfaces: "{{.}}",{{ end }}
    {{ with index .ObjectMeta.Annotations `traffic.sidecar.agentio.kruise.io/exclude-interfaces` }}traffic.sidecar.istio.io/excludeInterfaces: "{{.}}",{{ end }}
{{- end }}
  }
{{ with .Values.podAnnotations -}}{{ toYaml . | indent 8 }}{{ end }}
spec:
  {{- $noInitContainer := and
      (eq $interception `NONE`)
      (not $nativeSidecar) }}
  {{ if $noInitContainer }}
  initContainers: []
  {{ else -}}
  initContainers:
  {{ if ne $interception `NONE` }}
  {{ if .Values.pilot.cni.enabled -}}
  - name: agentio-validation
  {{ else -}}
  - name: agentio-init
  {{ end -}}
  {{- if contains "/" (annotation .ObjectMeta `sidecar.agentio.kruise.io/proxy-image` .Values.global.proxyInit.image) }}
    image: "{{ annotation .ObjectMeta `sidecar.agentio.kruise.io/proxy-image` .Values.global.proxyInit.image }}"
  {{- else }}
    image: "{{ .ProxyImage }}"
  {{- end }}
    args:
    - proxy-init
    - "-p"
    - {{ .MeshConfig.ProxyListenPort | default "15001" | quote }}
    - "-z"
    - {{ .MeshConfig.ProxyInboundListenPort | default "15006" | quote }}
    - "-u"
    - {{ .ProxyUID | default "1337" | quote }}
    - "-m"
    - "{{ $interception }}"
    - "-i"
    - "{{ annotation .ObjectMeta `traffic.sidecar.agentio.kruise.io/include-outbound-ip-ranges` .Values.global.proxy.includeIPRanges }}"
    - "-x"
    - "{{ annotation .ObjectMeta `traffic.sidecar.agentio.kruise.io/exclude-outbound-ip-ranges` .Values.global.proxy.excludeIPRanges }}"
    - "-b"
    - "{{ annotation .ObjectMeta `traffic.sidecar.agentio.kruise.io/include-inbound-ports` .Values.global.proxy.includeInboundPorts }}"
    - "-d"
  {{- if excludeInboundPort (annotation .ObjectMeta `sidecar.agentio.kruise.io/status-port` .Values.global.proxy.statusPort) (annotation .ObjectMeta `traffic.sidecar.agentio.kruise.io/exclude-inbound-ports` .Values.global.proxy.excludeInboundPorts) }}
    - "15090,15021,{{ excludeInboundPort (annotation .ObjectMeta `sidecar.agentio.kruise.io/status-port` .Values.global.proxy.statusPort) (annotation .ObjectMeta `traffic.sidecar.agentio.kruise.io/exclude-inbound-ports` .Values.global.proxy.excludeInboundPorts) }}"
  {{- else }}
    - "15090,15021"
  {{- end }}
    {{ if or (isset .ObjectMeta.Annotations `traffic.sidecar.agentio.kruise.io/include-outbound-ports`) (ne (valueOrDefault .Values.global.proxy.includeOutboundPorts "") "") -}}
    - "-q"
    - "{{ annotation .ObjectMeta `traffic.sidecar.agentio.kruise.io/include-outbound-ports` .Values.global.proxy.includeOutboundPorts }}"
    {{ end -}}
    {{ if or (isset .ObjectMeta.Annotations `traffic.sidecar.agentio.kruise.io/exclude-outbound-ports`) (ne (valueOrDefault .Values.global.proxy.excludeOutboundPorts "") "") -}}
    - "-o"
    - "{{ annotation .ObjectMeta `traffic.sidecar.agentio.kruise.io/exclude-outbound-ports` .Values.global.proxy.excludeOutboundPorts }}"
    {{ end -}}
    {{ if (isset .ObjectMeta.Annotations `traffic.sidecar.agentio.kruise.io/reroute-virtual-interfaces`) -}}
    - "-k"
    - "{{ index .ObjectMeta.Annotations `traffic.sidecar.agentio.kruise.io/reroute-virtual-interfaces` }}"
    {{ else if (isset .ObjectMeta.Annotations `traffic.sidecar.agentio.kruise.io/kubevirt-interfaces`) -}}
    - "-k"
    - "{{ index .ObjectMeta.Annotations `traffic.sidecar.agentio.kruise.io/kubevirt-interfaces` }}"
    {{ end -}}
    {{ if (isset .ObjectMeta.Annotations `traffic.sidecar.agentio.kruise.io/exclude-interfaces`) -}}
    - "-c"
    - "{{ index .ObjectMeta.Annotations `traffic.sidecar.agentio.kruise.io/exclude-interfaces` }}"
    {{ end -}}
    - "--reject-non-tcp={{ annotation .ObjectMeta `traffic.sidecar.agentio.kruise.io/reject-non-tcp` (valueOrDefault .Values.global.proxyInit.rejectNonTCP false) }}"
    - "--native-nftables={{ annotation .ObjectMeta `traffic.sidecar.agentio.kruise.io/native-nftables` (valueOrDefault .Values.global.nativeNftables false) }}"
    - "--native-nftables-output-priority={{ annotation .ObjectMeta `traffic.sidecar.agentio.kruise.io/nat-output-priority` (valueOrDefault .Values.global.proxyInit.natOutputPriority "-100") }}"
    - "--log-output-level={{ annotation .ObjectMeta `sidecar.agentio.kruise.io/agent-log-level` .Values.global.logging.level }}"
    {{ if .Values.global.logAsJson -}}
    - "--log-as-json"
    {{ end -}}
    {{ if .Values.pilot.cni.enabled -}}
    - "--run-validation"
    - "--skip-rule-apply"
    {{ else if .Values.global.proxyInit.forceApplyIptables -}}
    - "--force-apply"
    {{ end -}}
    {{with .Values.global.imagePullPolicy }}imagePullPolicy: "{{.}}"{{end}}
  {{- if .ProxyConfig.ProxyMetadata }}
    env:
    {{- range $key, $value := .ProxyConfig.ProxyMetadata }}
    - name: {{ $key }}
      value: "{{ $value }}"
    {{- end }}
  {{- end }}
    resources:
  {{ template "resources" . }}
    securityContext:
      allowPrivilegeEscalation: {{ .Values.global.proxy.privileged }}
      privileged: {{ .Values.global.proxy.privileged }}
      capabilities:
    {{- if not .Values.pilot.cni.enabled }}
        add:
        - NET_ADMIN
    {{- end }}
    {{- if not .Values.pilot.cni.enabled }}
      readOnlyRootFilesystem: false
      runAsGroup: 0
      runAsNonRoot: false
      runAsUser: 0
    {{- else }}
      readOnlyRootFilesystem: true
      runAsGroup: {{ .ProxyGID | default "1337" }}
      runAsUser: {{ .ProxyUID | default "1337" }}
      runAsNonRoot: true
    {{- end }}
    {{- if .Values.global.proxy.seccompProfile }}
      seccompProfile:
    {{- toYaml .Values.global.proxy.seccompProfile | nindent 8 }}
    {{- end }}
  {{ end -}}
  {{ end -}}
#############
# ZTUNNEL
#############
  {{ if not $nativeSidecar }}
  containers:
  {{ end }}
  - name: {{ $proxyContainerName }}
    {{ if $nativeSidecar }}restartPolicy: Always{{end}}
{{- if contains "/" .Values.global.proxyZtunnel.image }}
    image: "{{ .Values.global.proxyZtunnel.image }}"
{{- else }}
    image: "{{ .ProxyZtunnelImage }}"
{{- end }}
    ports:
    - containerPort: 15020
      name: ztunnel-stats
      protocol: TCP
    resources:
  {{ template "resources" . }}
{{- with .Values.global.imagePullPolicy }}
    imagePullPolicy: {{ . }}
{{- end }}
    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
      capabilities:
        drop:
        - ALL
{{- if .Values.global.proxyZtunnel.enableFirewallRules }}
        add:
        - NET_ADMIN
{{- end }}
      readOnlyRootFilesystem: true
      runAsUser: {{ if .Values.global.proxyZtunnel.enableFirewallRules }}0{{ else }}{{ .ProxyUID | default "1337" }}{{ end }}
      runAsGroup: {{ .ProxyGID | default "1337" }}
      runAsNonRoot: false
{{- if .Values.global.seLinuxOptions }}
      seLinuxOptions:
{{ toYaml .Values.global.seLinuxOptions | trim | indent 12 }}
{{- end }}
    readinessProbe:
      httpGet:
        port: 15021
        path: /healthz/ready
    args:
    - proxy
    - ztunnel
    env:
    - name: ENABLE_SANDBOX_MANAGER
      value: "{{ $sandboxEnabled }}"
    - name: AGENTIO_SANDBOX_MODE
      value: "{{ default `false` .Values.global.proxyZtunnel.sandboxMode }}"
{{- if .Values.global.proxyZtunnel.enableFirewallRules }}
    - name: ENABLE_FIREWALL_RULES
      value: "true"
{{- end }}
    - name: FIREWALL_BACKEND
      value: "{{ default `auto` .Values.global.proxyZtunnel.firewallBackend }}"
    - name: ENABLE_SIDECAR_MODE
      value: "true"
    - name: ENABLE_ORIG_SRC
      value: "false"
    - name: PROXY_MODE
      value: dedicated
    - name: CA_ADDRESS
    {{- if .Values.global.caAddress }}
      value: {{ .Values.global.caAddress }}
    {{- else }}
      value: {{ .ProxyConfig.DiscoveryAddress | quote }}
    {{- end }}
    - name: XDS_ADDRESS
    {{- if .Values.global.xdsAddress }}
      value: {{ .Values.global.xdsAddress }}
    {{- else }}
      value: {{ .ProxyConfig.DiscoveryAddress | quote }}
    {{- end }}
    {{- if .Values.global.proxyZtunnel.logAsJson }}
    - name: LOG_FORMAT
      value: json
    {{- end}}
    {{- if .Values.global.network }}
    - name: NETWORK
      value: {{ .Values.global.network | quote }}
    {{- end }}
    - name: RUST_BACKTRACE
      value: "1"
    - name: ISTIO_META_CLUSTER_ID
      value: "{{ valueOrDefault .Values.global.multiCluster.clusterName `Kubernetes` }}"
    {{- if not $nativeSidecar }}
    - name: TERMINATION_GRACE_PERIOD_SECONDS
      value: "{{ default .Values.global.proxyZtunnel.terminationGracePeriodSeconds 30 }}"
    {{- end}}
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: INSTANCE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: SERVICE_ACCOUNT
      valueFrom:
        fieldRef:
          fieldPath: spec.serviceAccountName
    - name: ZTUNNEL_CPU_LIMIT
      valueFrom:
        resourceFieldRef:
          resource: limits.cpu
          divisor: "1"
    {{- if .Values.global.proxyZtunnel.peerCaCrl.enabled }}
    - name: CRL_PATH
      value: "/var/run/secrets/istio/crl/ca-crl.pem"
    {{- end }}
    {{- if .ProxyConfig.ProxyMetadata }}
    {{- range $key, $value := .ProxyConfig.ProxyMetadata }}
    - name: {{ $key }}
      value: "{{ $value }}"
    {{- end }}
    {{- end }}
    {{- if .Values.global.proxy.lifecycle }}
    lifecycle:
      {{ toYaml .Values.global.proxy.lifecycle | indent 6 }}
    {{- end }}
    volumeMounts:
    - mountPath: /var/run/secrets/istio
      name: agentiod-ca-cert
    - mountPath: /var/run/secrets/tokens
      name: agentio-token
    - mountPath: /tmp
      name: tmp
    {{- if $sandboxEnabled }}
    - mountPath: /var/lib/ztunnel/sandbox
      name: agentio-sandbox-state
    {{- end }}
    {{- if .Values.global.proxyZtunnel.peerCaCrl.enabled }}
    - mountPath: /var/run/secrets/istio/crl
      name: agentio-ca-crl
    {{- end }}
    - name: pod-info
      mountPath: /etc/podinfo
  volumes:
  - name: pod-info
    downwardAPI:
      items:
        - path: "labels"
          fieldRef:
            fieldPath: metadata.labels
  - name: agentio-token
    projected:
      sources:
      - serviceAccountToken:
          path: istio-token
          expirationSeconds: 43200
          audience: {{ .Values.global.sds.token.aud | default "agentio-ca" | quote }}
  - name: agentiod-ca-cert
    {{- if eq (.Values.pilot.env).ENABLE_CLUSTER_TRUST_BUNDLE_API true }}
    projected:
      sources:
      - clusterTrustBundle:
          name: {{ .Values.global.clusterTrustBundleName | default "agentio-ca-root-cert" }}
          path: root-cert.pem
    {{- else }}
    configMap:
      name: {{ .Values.global.trustBundleName | default "agentio-ca-root-cert" }}
    {{- end }}
  # pprof needs a writable /tmp, and we don't have that thanks to `readOnlyRootFilesystem: true`, so mount one
  - name: tmp
    emptyDir: {}
  {{- if $sandboxEnabled }}
  - name: agentio-sandbox-state
    emptyDir: {}
  {{- end }}
