{{- $egressGateway := .Values.global.egressGateway | default .Values.global.waypoint }}
{{- $porter := .Values.global.porter | default (strdict) }}
{{- $porterCache := $porter.cache | default (strdict) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{.ServiceAccount | quote}}
  namespace: {{.Namespace | quote}}
  annotations:
    {{- toJsonMap (omit .InfrastructureAnnotations "kubectl.kubernetes.io/last-applied-configuration" "gateway.agentio.kruise.io/name-override" "gateway.agentio.kruise.io/service-account" "gateway.agentio.kruise.io/controller-version") | nindent 4 }}
  labels:
    {{- toJsonMap
      .InfrastructureLabels
      (strdict
        "gateway.networking.k8s.io/gateway-name" .Name
        "gateway.networking.k8s.io/gateway-class-name" .GatewayClass
      ) | nindent 4 }}
  {{- if ge .KubeVersion 128 }}
  # Safe since 1.28: https://github.com/kubernetes/kubernetes/pull/117412
  ownerReferences:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    name: "{{.Name}}"
    uid: "{{.UID}}"
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.DeploymentName | quote}}
  namespace: {{.Namespace | quote}}
  annotations:
    {{- toJsonMap (omit .InfrastructureAnnotations "kubectl.kubernetes.io/last-applied-configuration" "gateway.agentio.kruise.io/name-override" "gateway.agentio.kruise.io/service-account" "gateway.agentio.kruise.io/controller-version") | nindent 4 }}
  labels:
    {{- toJsonMap
      .InfrastructureLabels
      (strdict
        "gateway.networking.k8s.io/gateway-name" .Name
        "gateway.networking.k8s.io/gateway-class-name" .GatewayClass
        "gateway.agentio.kruise.io/managed" .ControllerLabel
      ) | nindent 4 }}
  ownerReferences:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    name: "{{.Name}}"
    uid: "{{.UID}}"
spec:
  selector:
    matchLabels:
      "{{.GatewayNameLabel}}": "{{.Name}}"
  template:
    metadata:
      annotations:
        {{- toJsonMap
          (omit .InfrastructureAnnotations "kubectl.kubernetes.io/last-applied-configuration" "gateway.agentio.kruise.io/name-override" "gateway.agentio.kruise.io/service-account" "gateway.agentio.kruise.io/controller-version")
          (strdict
            "prometheus.io/path" "/stats/prometheus"
            "prometheus.io/port" "15020"
            "prometheus.io/scrape" "true"
          ) | nindent 8 }}
      labels:
        {{- toJsonMap
          (strdict
            "agentio.kruise.io/dataplane-mode" "none"
           )
          .InfrastructureLabels
          (strdict
            "gateway.networking.k8s.io/gateway-name" .Name
            "gateway.networking.k8s.io/gateway-class-name" .GatewayClass
            "gateway.agentio.kruise.io/managed" .ControllerLabel
          ) | nindent 8}}
    spec:
      terminationGracePeriodSeconds: {{ valueOrDefault $egressGateway.terminationGracePeriodSeconds 30 }}
      {{- if $egressGateway.affinity }}
      affinity:
      {{- toYaml $egressGateway.affinity | nindent 8 }}
      {{- end }}
      {{- if $egressGateway.topologySpreadConstraints }}
      topologySpreadConstraints:
      {{- toYaml $egressGateway.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      {{- if $egressGateway.nodeSelector }}
      nodeSelector:
      {{- toYaml $egressGateway.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if $egressGateway.tolerations }}
      tolerations:
      {{- toYaml $egressGateway.tolerations | nindent 8 }}
      {{- end }}
      serviceAccountName: {{.ServiceAccount | quote}}
      containers:
      - name: agentio-proxy
        ports:
        - containerPort: 15020
          name: metrics
          protocol: TCP
        - containerPort: 15021
          name: status-port
          protocol: TCP
        - containerPort: 15090
          protocol: TCP
          name: http-envoy-prom
        {{- /* The image comes only from operator values; a Gateway annotation must
        not be able to choose it (upstream honored sidecar.agentio.kruise.io/proxy-image
        here, which let any Gateway creator run an arbitrary image). */}}
        image: "{{ .ProxyImage }}"
{{ with .Values.global.imagePullPolicy }}        imagePullPolicy: "{{.}}"{{ end }}
        args:
        - --domain=$(POD_NAMESPACE).svc.{{ .Values.global.proxy.clusterDomain }}
        - --envoy-log-level
        - {{ annotation .ObjectMeta `sidecar.agentio.kruise.io/log-level` .Values.global.proxy.logLevel | quote }}
        - --envoy-component-log-level
        - {{ annotation .ObjectMeta `sidecar.agentio.kruise.io/component-log-level` .Values.global.proxy.componentLogLevel | quote }}
        - --agent-log-level
        - {{ annotation .ObjectMeta `sidecar.agentio.kruise.io/agent-log-level` "info" | quote }}
        {{- if .Values.global.logAsJson }}
        - --log-as-json
        {{- end }}
        env:
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        - name: POD_UID
          valueFrom: {fieldRef: {fieldPath: metadata.uid}}
        - name: AGENTIO_XDS_ADDRESS
          value: {{ .Values.global.xdsAddress | default .ProxyConfig.DiscoveryAddress | default .Values.global.caAddress | quote }}
        - name: CA_ADDR
          value: {{ .Values.global.caAddress | quote }}
        - name: AGENTIO_GATEWAY_CONFIG
          value: {{ .Values.global.egressGateway.agentConfig | default (strdict) | toJson | quote }}
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: INSTANCE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: AGENTIO_CPU_LIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
              divisor: "1"
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.memory
              divisor: "1"
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
              divisor: "1"
        - name: CLUSTER_ID
          value: "{{ valueOrDefault .Values.global.multiCluster.clusterName `Kubernetes` }}"
        {{- $network := valueOrDefault (index .InfrastructureLabels `agentio.kruise.io/network`) .Values.global.network }}
        {{- if $network }}
        - name: AGENTIO_META_NETWORK
          value: "{{ $network }}"
        {{- end }}
        - name: AGENTIO_META_WORKLOAD_NAME
          value: {{.DeploymentName}}
        - name: AGENTIO_META_OWNER
          value: kubernetes://apis/apps/v1/namespaces/{{.Namespace}}/deployments/{{.DeploymentName}}
        {{- if .Values.global.meshID }}
        - name: AGENTIO_META_MESH_ID
          value: "{{ .Values.global.meshID }}"
        {{- else if (valueOrDefault .TrustDomain .Values.global.trustDomain) }}
        - name: AGENTIO_META_MESH_ID
          value: "{{ (valueOrDefault .TrustDomain .Values.global.trustDomain) }}"
        {{- end }}
        {{- with (valueOrDefault .TrustDomain .Values.global.trustDomain) }}
        - name: TRUST_DOMAIN
          value: "{{ . }}"
        {{- end }}
        {{- if $egressGateway.resources }}
        resources:
        {{- toYaml (omitNil $egressGateway.resources) | trim | nindent 10 }}
        {{- end }}
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz/ready
            port: 15021
            scheme: HTTP
          initialDelaySeconds: 1
          periodSeconds: 1
          successThreshold: 1
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 4
          httpGet:
            path: /healthz/ready
            port: 15021
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 1
        securityContext:
          privileged: false
        {{- if not (eq .Values.global.platform "openshift") }}
          runAsGroup: 1337
          runAsUser: 1337
        {{- end }}
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
{{- if .Values.gateways.seccompProfile }}
          seccompProfile:
{{- toYaml .Values.gateways.seccompProfile | nindent 12 }}
{{- end }}
        volumeMounts:
        - mountPath: /var/run/secrets/workload-spiffe-uds
          name: workload-socket
        - mountPath: /var/run/secrets/agentio
          name: agentiod-ca-cert
        - mountPath: /var/lib/agentio/data
          name: agentio-data
        - mountPath: /etc/agentio/proxy
          name: agentio-envoy
        - mountPath: /var/run/secrets/tokens
          name: agentio-token
        - mountPath: /etc/agentio/pod
          name: agentio-podinfo
      initContainers:
      - name: agentio-porter
        restartPolicy: Always
        image: {{ $porter.image | quote }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy | quote }}
        args:
          - --domain=$(POD_NAMESPACE).svc.{{ .Values.global.proxy.clusterDomain }}
          - --xds-address={{ .Values.global.xdsAddress | default .ProxyConfig.DiscoveryAddress | default .Values.global.caAddress }}
          - --cluster-id={{ .ClusterID }}
          - --grpc-port=9002
          - --grpc-health-port=9003
          - --xds-cache-idle-ttl={{ valueOrDefault $porterCache.idleTTL "1m" }}
          - --xds-cache-max-entries={{ valueOrDefault $porterCache.maxEntries 10000 }}
        env:
          - name: POD_NAME
            valueFrom: {fieldRef: {fieldPath: metadata.name}}
          - name: POD_NAMESPACE
            valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          - name: POD_UID
            valueFrom: {fieldRef: {fieldPath: metadata.uid}}
          - name: POD_IP
            valueFrom: {fieldRef: {fieldPath: status.podIP}}
        ports:
          - name: health
            containerPort: 9003
        readinessProbe:
          grpc: {port: 9003, service: readiness}
          periodSeconds: 5
        livenessProbe:
          grpc: {port: 9003, service: liveness}
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1337
          runAsGroup: 1337
        resources:
{{- toYaml $porter.resources | trim | nindent 10 }}
        volumeMounts:
          - {name: agentiod-ca-cert, mountPath: /var/run/secrets/agentio, readOnly: true}
          - {name: agentio-token, mountPath: /var/run/secrets/tokens, readOnly: true}
      volumes:
      - emptyDir: {}
        name: workload-socket
      - emptyDir:
          medium: Memory
        name: agentio-envoy
      - emptyDir:
          medium: Memory
        name: go-proxy-envoy
      - emptyDir: {}
        name: agentio-data
      - emptyDir: {}
        name: go-proxy-data
      - downwardAPI:
          items:
          - fieldRef:
              fieldPath: metadata.labels
            path: labels
          - fieldRef:
              fieldPath: metadata.annotations
            path: annotations
        name: agentio-podinfo
      - name: agentio-token
        projected:
          sources:
          - serviceAccountToken:
              audience: {{ .Values.global.sds.token.aud | default "agentio-ca" | quote }}
              expirationSeconds: 43200
              path: agentio-token
      - name: agentiod-ca-cert
      {{- if eq (.Values.agentio.env).ENABLE_CLUSTER_TRUST_BUNDLE_API true }}
        projected:
          sources:
          - clusterTrustBundle:
              name: {{ .Values.global.clusterTrustBundleName | default "agentio-ca-root-cert" }}
              path: root-cert.pem
      {{- else }}
        configMap:
          name: {{ .Values.global.trustBundleName | default "agentio-ca-root-cert" }}
      {{- end }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- toJsonMap
      (omit .InfrastructureAnnotations
        "kubectl.kubernetes.io/last-applied-configuration"
        "gateway.agentio.kruise.io/name-override"
        "gateway.agentio.kruise.io/service-account"
        "gateway.agentio.kruise.io/controller-version"
      ) | nindent 4 }}
  labels:
    {{- toJsonMap
      .InfrastructureLabels
      (strdict
        "gateway.networking.k8s.io/gateway-name" .Name
        "gateway.networking.k8s.io/gateway-class-name" .GatewayClass
      ) | nindent 4 }}
  name: {{.DeploymentName | quote}}
  namespace: {{.Namespace | quote}}
  ownerReferences:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    name: "{{.Name}}"
    uid: "{{.UID}}"
spec:
  ipFamilyPolicy: PreferDualStack
  ports:
  {{- range $key, $val := .Ports }}
  - name: {{ $val.Name | quote }}
    port: {{ $val.Port }}
    protocol: TCP
    appProtocol: {{ $val.AppProtocol }}
  {{- end }}
  selector:
    "{{.GatewayNameLabel}}": "{{.Name}}"
  {{- if and (.Spec.Addresses) (eq .ServiceType "LoadBalancer") }}
  loadBalancerIP: {{ (index .Spec.Addresses 0).Value | quote}}
  {{- end }}
  type: {{ .ServiceType | quote }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{.DeploymentName | quote}}
  namespace: {{.Namespace | quote}}
  annotations:
    {{- toJsonMap (omit .InfrastructureAnnotations "kubectl.kubernetes.io/last-applied-configuration" "gateway.agentio.kruise.io/name-override" "gateway.agentio.kruise.io/service-account" "gateway.agentio.kruise.io/controller-version") | nindent 4 }}
  labels:
    {{- toJsonMap
          .InfrastructureLabels
          (strdict
          "gateway.networking.k8s.io/gateway-name" .Name
          "gateway.networking.k8s.io/gateway-class-name" .GatewayClass
          ) | nindent 4 }}
  ownerReferences:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: {{.Name}}
      uid: "{{.UID}}"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name:  {{.DeploymentName | quote}}
  maxReplicas: 1
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{.DeploymentName | quote}}
  namespace: {{.Namespace | quote}}
  annotations:
    {{- toJsonMap (omit .InfrastructureAnnotations "kubectl.kubernetes.io/last-applied-configuration" "gateway.agentio.kruise.io/name-override" "gateway.agentio.kruise.io/service-account" "gateway.agentio.kruise.io/controller-version") | nindent 4 }}
  labels:
    {{- toJsonMap
          .InfrastructureLabels
          (strdict
          "gateway.networking.k8s.io/gateway-name" .Name
          "gateway.networking.k8s.io/gateway-class-name" .GatewayClass
          ) | nindent 4 }}
  ownerReferences:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: {{.Name}}
      uid: "{{.UID}}"
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: {{.Name|quote}}
