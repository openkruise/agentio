{{- if eq .Values.epe.mode "managed" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "epe.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "epe.labels" . | nindent 4 }}
rules:
  - apiGroups: ["agents.kruise.io"]
    resources: ["securityprofiles", "globalsecurityprofiles"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.sandbox.enabled }}
  - apiGroups: ["agents.kruise.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
{{- if eq .Values.epe.secretWatchScope "cluster" }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "watch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "epe.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "epe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "epe.fullname" . }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "epe.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "epe.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "epe.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "epe.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "epe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "epe.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "epe.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
