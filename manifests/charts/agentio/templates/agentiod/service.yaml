{{- define "agentiod.service" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentiod.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentiod.labels" . | nindent 4 }}
  {{- with .Values.agentiod.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    {{- include "agentiod.selectorLabels" . | nindent 4 }}
    {{- if eq (.Values.agentiod.controlPlanePool | default "proxy") "policy" }}
    agentio.kruise.io/control-plane-pool: policy
    {{- end }}
  ports:
    - name: grpc-xds
      port: 15012
      targetPort: grpc-xds
    - name: http-monitoring
      port: 15014
      targetPort: http-monitoring
    {{- if eq .Values.profile "sidecar" }}
    - name: https-webhook
      port: 443
      targetPort: https-webhook
    {{- end }}
{{- end -}}
{{ include "agentiod.service" . }}
