{{- define "agentiod.networkpolicy" -}}
{{- if .Values.agentiod.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentiod.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentiod.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentiod.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 15012
        - port: 15014
        {{- if eq .Values.profile "sidecar" }}
        - port: 15017
        {{- end }}
{{- end }}
{{- end -}}
{{ include "agentiod.networkpolicy" . }}
