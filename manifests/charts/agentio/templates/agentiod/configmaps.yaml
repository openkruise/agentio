{{- $defaults := dict -}}
{{- if eq .Values.egressGateway.mode "static" -}}
{{- $gateway := dict "name" (include "gateway.fullname" .) "namespace" .Release.Namespace -}}
{{- $_ := set $defaults "egressGateways" (list $gateway) -}}
{{- end -}}
{{- if ne .Values.epe.mode "disabled" -}}
{{- $request := dict "headerMode" "SEND" "attributes" (list "filter_state['sandbox.id']" "filter_state['sandbox.token']" "filter_state['sandbox.labels']" "filter_state['agentio.workload.name']" "filter_state['agentio.workload.namespace']" "filter_state['downstream_peer'].name" "filter_state['downstream_peer'].namespace" "destination.port" "source.address") -}}
{{- $response := dict "headerMode" "SKIP" -}}
{{- $provider := dict "service" (include "agentio.epeService" .) "port" (include "agentio.epePort" . | int) "messageTimeout" .Values.epe.messageTimeout "request" $request "response" $response -}}
{{- if .Values.epe.tls.enabled -}}
{{- $peers := .Values.epe.tls.peerSpiffeIDs -}}
{{- if and (empty $peers) (eq .Values.epe.mode "managed") -}}
{{- $peers = list (printf "spiffe://%s/ns/%s/sa/%s" .Values.global.trustDomain .Release.Namespace (include "epe.serviceAccountName" .)) -}}
{{- end -}}
{{- $_ := set $provider "tls" (dict "mode" "MUTUAL" "peerSpiffeIDs" $peers) -}}
{{- end -}}
{{- $_ := set $defaults "sandboxExtProc" $provider -}}
{{- end -}}
{{- $config := mergeOverwrite (deepCopy $defaults) (.Values.agentiod.config.values | default dict) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.agentiod.config.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentiod.labels" . | nindent 4 }}
data:
  config: |
    {{- toYaml $config | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.agentiod.config.sourcesName }}
  namespace: {{ .Release.Namespace }}
  labels:
    manifests.agents.kruise.io/kube-source: "true"
    {{- include "agentiod.labels" . | nindent 4 }}
data:
  sources: |
    {{- .Values.agentiod.config.sources | nindent 4 }}
