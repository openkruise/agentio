{{- if or (eq .Values.profile "sidecar") .Values.agentiod.gatewayDeployer.enabled }}
{{- $ztunnelImage := include "agentiod.componentImage" (list .Values.agentiod.injector.ztunnel.image .Values.agentiod.injector.ztunnel.imageName .) }}
{{- $proxyInitImage := include "agentiod.componentImage" (list .Values.agentiod.injector.proxyInit.image .Values.agentiod.injector.proxyInit.imageName .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.agentiod.injector.configMapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: sidecar-injector
    {{- include "agentiod.labels" . | nindent 4 }}
data:
  config: |-
    defaultTemplates: [ztunnel]
    policy: enabled
    alwaysInjectSelector: []
    neverInjectSelector: []
    template: {{ `{{ Template_Version_And_Agentio_Version_Mismatched_Check_Installation }}` | quote }}
    templates:
      ztunnel: |
{{ .Files.Get "files/ztunnel-injection-template.yaml" | trim | indent 8 }}
      egress-gateway: |
{{ .Files.Get "files/egress-gateway.yaml" | trim | indent 8 }}
      agentgateway: |
{{ .Files.Get "files/agentgateway.yaml" | trim | indent 8 }}
  values: |-
    clientTrust:
{{ .Values.agentiod.injector.clientTrust | toYaml | indent 6 }}
    clientTrustBundle:
{{ .Values.agentiod.clientTrustBundle | toYaml | indent 6 }}
    global:
      porter:
        image: {{ include "gateway.porterImage" . | quote }}
        cache:
{{ .Values.egressGateway.porter.cache | toYaml | indent 10 }}
        resources:
{{ .Values.egressGateway.porter.resources | toYaml | indent 10 }}
      agentgateway:
        image: {{ .Values.egressGateway.agentgateway.image | quote }}
        ca:
{{ .Values.egressGateway.agentgateway.ca | toYaml | indent 10 }}
        terminationGracePeriodSeconds: 30
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "2", memory: 1Gi}
      hub: {{ .Values.global.hub | quote }}
      tag: {{ .Values.global.tag | quote }}
      imagePullPolicy: {{ .Values.global.imagePullPolicy | quote }}
      imagePullSecrets:
{{ .Values.global.imagePullSecrets | toYaml | indent 8 }}
      trustDomain: {{ .Values.global.trustDomain | quote }}
      caAddress: {{ printf "%s.%s.svc.%s:15012" (include "agentiod.fullname" .) .Release.Namespace .Values.global.clusterDomain | quote }}
      {{- if .Values.agentiod.policyPool.enabled }}
      gatewayXdsAddress: {{ include "gateway.xdsAddress" . | quote }}
      {{- end }}
      xdsAddress: {{ printf "%s.%s.svc.%s:15012" (include "agentiod.fullname" .) .Release.Namespace .Values.global.clusterDomain | quote }}
      trustBundleName: {{ .Values.agentiod.ca.trustBundleConfigMapName | quote }}
      clusterTrustBundleName: {{ .Values.ztunnel.trustBundle.clusterTrustBundleName | quote }}
      nativeNftables: {{ .Values.agentiod.injector.proxyInit.nativeNftables }}
      logging:
        level: default:info
      logAsJson: false
      meshID: ""
      network: ""
      platform: ""
      proxy:
        image: {{ include "gateway.image" . | quote }}
        clusterDomain: {{ .Values.global.clusterDomain | quote }}
        componentLogLevel: misc:error
        logLevel: warning
        outlierLogPath: ""
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "2", memory: 1Gi}
        includeIPRanges: "*"
        excludeIPRanges: ""
        includeInboundPorts: "*"
        excludeInboundPorts: ""
        includeOutboundPorts: ""
        excludeOutboundPorts: ""
        statusPort: 15020
        privileged: false
        seccompProfile: {}
      proxyInit:
        image: {{ $proxyInitImage | quote }}
        forceApplyIptables: false
        natOutputPriority: {{ .Values.agentiod.injector.proxyInit.natOutputPriority | quote }}
        rejectNonTCP: {{ .Values.agentiod.injector.proxyInit.rejectNonTCP }}
      proxyZtunnel:
        image: {{ $ztunnelImage | quote }}
        sandboxMode: {{ .Values.sandbox.enabled | quote }}
        enableFirewallRules: {{ .Values.agentiod.injector.ztunnel.enableFirewallRules }}
        firewallBackend: {{ .Values.agentiod.injector.ztunnel.firewallBackend | quote }}
        logAsJson: true
      sds:
        token:
          aud: {{ .Values.agentiod.tokenAudience | quote }}
      multiCluster:
        clusterName: {{ .Values.global.clusterId | quote }}
      egressGateway:
        terminationGracePeriodSeconds: {{ .Values.egressGateway.terminationGracePeriodSeconds }}
        agentConfig: {{ .Values.egressGateway.agentConfig | toJson }}
        resources:
{{ .Values.egressGateway.resources | toYaml | indent 10 }}
        nodeSelector:
{{ .Values.egressGateway.nodeSelector | toYaml | indent 10 }}
        tolerations:
{{ .Values.egressGateway.tolerations | toYaml | indent 10 }}
        affinity:
{{ .Values.egressGateway.affinity | toYaml | indent 10 }}
        topologySpreadConstraints:
{{ .Values.egressGateway.topologySpreadConstraints | toYaml | indent 10 }}
    gateways:
      seccompProfile: {}
    agentio:
      env:
        AGENTIO_SANDBOX_MODE: {{ .Values.sandbox.enabled }}
        AGENTIO_ENABLE_SNI_TRAFFIC_POLICY: {{ .Values.agentiod.enableSNITrafficPolicy }}
    pilot:
      cni:
        enabled: {{ eq .Values.profile "ambient" }}
        provider: default
        networkName: {{ .Values.cni.networkName | quote }}
    sidecarInjectorWebhook:
      rewriteAppHTTPProbe: true
{{- if eq .Values.profile "sidecar" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "agentiod.webhookName" . }}
  labels:
    app: sidecar-injector
    {{- include "agentiod.labels" . | nindent 4 }}
webhooks:
  - name: namespace.sidecar-injector.agentio.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: {{ .Values.agentiod.injector.failurePolicy }}
    reinvocationPolicy: {{ .Values.agentiod.injector.reinvocationPolicy }}
    clientConfig:
      caBundle: ""
      service:
        name: {{ include "agentiod.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /inject
        port: 443
    namespaceSelector:
      matchLabels:
        agentio.kruise.io/dataplane-mode: sidecar
    objectSelector:
      matchExpressions:
        - key: agentio.kruise.io/dataplane-mode
          operator: NotIn
          values: [none, ambient]
    rules:
      - operations: [CREATE]
        apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
  - name: object.sidecar-injector.agentio.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: {{ .Values.agentiod.injector.failurePolicy }}
    reinvocationPolicy: {{ .Values.agentiod.injector.reinvocationPolicy }}
    clientConfig:
      caBundle: ""
      service:
        name: {{ include "agentiod.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /inject
        port: 443
    namespaceSelector:
      matchExpressions:
        - key: agentio.kruise.io/dataplane-mode
          operator: DoesNotExist
    objectSelector:
      matchLabels:
        agentio.kruise.io/dataplane-mode: sidecar
    rules:
      - operations: [CREATE]
        apiGroups: [""]
        apiVersions: [v1]
        resources: [pods]
{{- end }}
{{- end }}
