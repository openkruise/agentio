{{- if and (eq .Values.profile "ambient") .Values.cni.enabled }}
{{- if .Values.cni.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentio-cni.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentio-cni.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 15014
        - port: 8000
{{- end }}
{{- end }}
