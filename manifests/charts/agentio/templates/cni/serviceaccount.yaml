{{- if and (eq .Values.profile "ambient") .Values.cni.enabled }}
{{- if .Values.cni.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentio-cni.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentio-cni.labels" . | nindent 4 }}
  {{- with .Values.cni.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
