{{- if and (eq .Values.profile "ambient") .Values.cni.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentio-cni.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentio-cni.labels" . | nindent 4 }}
data:
  CURRENT_AGENT_VERSION: {{ .Values.cni.image.tag | default .Values.global.tag | quote }}
  AMBIENT_ENABLED: "true"
  AMBIENT_DNS_CAPTURE: {{ .Values.cni.dnsCapture | quote }}
  AMBIENT_IPV6: {{ .Values.cni.ipv6 | quote }}
  AMBIENT_RECONCILE_POD_RULES_ON_STARTUP: {{ .Values.cni.reconcileIptablesOnStartup | quote }}
  {{- with .Values.cni.cniConfFileName }}
  CNI_CONF_NAME: {{ . | quote }}
  {{- end }}
  CHAINED_CNI_PLUGIN: {{ .Values.cni.chained | quote }}
  EXCLUDE_NAMESPACES: {{ join "," .Values.cni.excludeNamespaces | quote }}
  REPAIR_ENABLED: {{ .Values.cni.repair.enabled | quote }}
  REPAIR_REPAIR_PODS: {{ .Values.cni.repair.repairPods | quote }}
  REPAIR_LABEL_PODS: {{ .Values.cni.repair.labelPods | quote }}
  REPAIR_DELETE_PODS: {{ .Values.cni.repair.deletePods | quote }}
  REPAIR_INIT_CONTAINER_NAME: {{ .Values.cni.repair.initContainerName | quote }}
  REPAIR_BROKEN_POD_LABEL_KEY: {{ .Values.cni.repair.brokenPodLabelKey | quote }}
  REPAIR_BROKEN_POD_LABEL_VALUE: {{ .Values.cni.repair.brokenPodLabelValue | quote }}
  AMBIENT_ENABLEMENT_SELECTOR: |
    {{- toYaml .Values.cni.enablementSelector | nindent 4 }}
{{- end }}
