{{- if .Values.egressGateway.enabled }}
{{- if .Values.egressGateway.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ .Values.egressGateway.service.ports.mesh }}
        - port: {{ .Values.egressGateway.service.ports.status }}
        - port: 9004
        - port: 15020
        - port: 15090
{{- end }}
{{- end }}
