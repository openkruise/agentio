{{- if .Values.egressGateway.enabled }}
{{- if .Values.egressGateway.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  minReplicas: {{ .Values.egressGateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.egressGateway.autoscaling.maxReplicas }}
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "gateway.fullname" . }}}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.egressGateway.autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}
{{- end }}
