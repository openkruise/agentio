{{- if and (eq .Values.profile "ambient") .Values.ztunnel.enabled }}
{{- if eq .Values.ztunnel.platform "openshift" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ztunnel.fullname" . }}
  labels:
    {{- include "ztunnel.labels" . | nindent 4 }}
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["privileged"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ztunnel.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ztunnel.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ztunnel.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
