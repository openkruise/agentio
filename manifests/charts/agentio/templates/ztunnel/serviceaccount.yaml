{{- if and (eq .Values.profile "ambient") .Values.ztunnel.enabled }}
{{- if .Values.ztunnel.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ztunnel.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ztunnel.labels" . | nindent 4 }}
  {{- with .Values.ztunnel.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
