{{- if and (eq .Values.profile "ambient") .Values.ztunnel.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ztunnel.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ztunnel.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ztunnel.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.ztunnel.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "ztunnel.selectorLabels" . | nindent 8 }}
        agentio.kruise.io/dataplane-mode: none
        {{- with .Values.ztunnel.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15020"
        {{- with .Values.ztunnel.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ztunnel.serviceAccountName" . }}
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: {{ .Values.ztunnel.terminationGracePeriodSeconds }}
      nodeSelector:
        {{- toYaml .Values.ztunnel.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.ztunnel.tolerations | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ztunnel
          image: {{ include "ztunnel.image" . | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - proxy
            - ztunnel
          env:
            - name: CA_ADDRESS
              value: {{ include "ztunnel.xdsAddress" . | quote }}
            - name: XDS_ADDRESS
              value: {{ include "ztunnel.xdsAddress" . | quote }}
            - name: ENABLE_SANDBOX_MANAGER
              value: "false"
            - name: AGENTIO_SANDBOX_MODE
              value: {{ .Values.sandbox.enabled | quote }}
            - name: INPOD_ENABLED
              value: "true"
            - name: RUST_LOG
              value: {{ .Values.ztunnel.logLevel | quote }}
            - name: RUST_BACKTRACE
              value: "1"
            - name: ISTIO_META_CLUSTER_ID
              value: {{ .Values.global.clusterId | quote }}
            - name: TRUST_DOMAIN
              value: {{ .Values.global.trustDomain | quote }}
            - name: TERMINATION_GRACE_PERIOD_SECONDS
              value: {{ .Values.ztunnel.terminationGracePeriodSeconds | quote }}
            {{- if .Values.ztunnel.enableFirewallRules }}
            - name: ENABLE_FIREWALL_RULES
              value: "true"
            {{- end }}
            {{- if .Values.ztunnel.logAsJson }}
            - name: LOG_FORMAT
              value: json
            {{- end }}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: INSTANCE_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: SERVICE_ACCOUNT
              valueFrom: {fieldRef: {fieldPath: spec.serviceAccountName}}
            {{- range $name, $value := .Values.ztunnel.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: ztunnel-stats
              containerPort: 15020
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 15021
          securityContext:
            allowPrivilegeEscalation: true
            privileged: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, SYS_ADMIN, NET_RAW]
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 1337
            runAsNonRoot: false
          resources:
            {{- toYaml .Values.ztunnel.resources | nindent 12 }}
          volumeMounts:
            - name: agentio-token
              mountPath: /var/run/secrets/tokens
            - name: agentiod-ca-cert
              mountPath: /var/run/secrets/istio
            - name: cni-ztunnel-sock-dir
              mountPath: /var/run/ztunnel
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: agentio-token
          projected:
            sources:
              - serviceAccountToken:
                  path: istio-token
                  expirationSeconds: 43200
                  audience: {{ .Values.ztunnel.tokenAudience }}
        - name: agentiod-ca-cert
          {{- if .Values.ztunnel.trustBundle.useClusterTrustBundle }}
          projected:
            sources:
              - clusterTrustBundle:
                  name: {{ .Values.ztunnel.trustBundle.clusterTrustBundleName }}
                  path: root-cert.pem
          {{- else }}
          configMap:
            name: {{ include "agentiod.caConfigMapName" . }}
          {{- end }}
        - name: cni-ztunnel-sock-dir
          hostPath:
            path: /var/run/ztunnel
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
{{- end }}
