{{- if and (eq .Values.profile "ambient") .Values.ztunnel.enabled }}
{{- if .Values.ztunnel.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ztunnel.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "ztunnel.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 15020
        - port: 15021
{{- end }}
{{- end }}
