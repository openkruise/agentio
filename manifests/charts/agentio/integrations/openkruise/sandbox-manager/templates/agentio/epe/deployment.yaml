{{/* Code generated by agentio-chart-sync. DO NOT EDIT. */}}
{{- if .Values.agentio.enabled }}
{{- if eq .Values.agentio.epe.mode "managed" }}
{{- include "agentio.validate" . }}
{{- $source := .Values.agentio.epe.credentialProvider.mtls.source }}
{{- $certificateSource := .Values.agentio.epe.tls.certificateSource | default dict }}
{{- $ca := $certificateSource.ca | default dict }}
{{- $caMode := and .Values.agentio.epe.tls.enabled (not (hasKey $certificateSource "file")) }}
{{- $mountRoot := and $caMode (not (hasKey $ca "caCertificateFile")) }}
{{- $mountToken := and $caMode (not (hasKey $ca "tokenFile")) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentio.epe.fullname" . }}
  namespace: {{ (include "agentio.namespace" .) }}
  labels:
    {{- include "agentio.epe.labels" . | nindent 4 }}
spec:
  {{- if not .Values.agentio.epe.autoscaling.enabled }}
  replicas: {{ .Values.agentio.epe.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agentio.epe.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentio.epe.selectorLabels" . | nindent 8 }}
        agentio.kruise.io/dataplane-mode: none
        {{- with .Values.agentio.epe.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        {{- with .Values.agentio.epe.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agentio.epe.serviceAccountName" . }}
      {{- with .Values.agentio.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: epe
          image: {{ include "agentio.epe.image" . | quote }}
          imagePullPolicy: {{ .Values.agentio.global.imagePullPolicy }}
          args:
            - -epe-config={{ include "agentio.epe.fullname" . }}-config
            - -epe-config-primary={{ include "agentio.epe.fullname" . }}-config-primary
            - -epe-config-namespace={{ (include "agentio.namespace" .) }}
            {{- if .Values.agentio.epe.tls.enabled }}
            {{- if $caMode }}
            - -tls-source=ca
            - {{ printf "-ca-address=%s" (default (include "agentio.agentiod.caAddress" .) $ca.address) | quote }}
            - {{ printf "-ca-token-path=%s" (default "/var/run/secrets/tokens/agentio-token" $ca.tokenFile) | quote }}
            - {{ printf "-ca-root-path=%s" (default "/var/run/secrets/agentio/root-cert.pem" $ca.caCertificateFile) | quote }}
            - -tls-spiffe-id={{ printf "spiffe://%s/ns/%s/sa/%s" .Values.agentio.global.trustDomain (include "agentio.namespace" .) (include "agentio.epe.serviceAccountName" .) }}
            {{- else }}
            - -tls-source=file
            - {{ printf "-tls-cert-path=%s" $certificateSource.file.certificateFile | quote }}
            - {{ printf "-tls-key-path=%s" $certificateSource.file.privateKeyFile | quote }}
            - {{ printf "-tls-ca-path=%s" $certificateSource.file.caCertificateFile | quote }}
            {{- end }}
            {{- end }}
            - -grpc-port={{ .Values.agentio.epe.service.grpcPort }}
            - -grpc-health-port={{ .Values.agentio.epe.service.healthPort }}
            - -metrics-port={{ .Values.agentio.epe.service.metricsPort }}
            - -audit-webhook-insecure-skip-verify={{ .Values.agentio.epe.auditWebhook.insecureSkipVerify }}
          env:
            - name: IDENTITY_PROVIDER_URL
              value: {{ .Values.agentio.epe.credentialProvider.url | quote }}
            - name: TOKEN_CACHE_TTL
              value: {{ .Values.agentio.epe.tokenCacheTTL | quote }}
            - name: TOKEN_CACHE_MAX_SIZE
              value: {{ .Values.agentio.epe.tokenCacheMaxSize | quote }}
            - name: CREDENTIAL_PROVIDER_MTLS_SOURCE
              value: {{ $source | quote }}
            {{- if eq $source "secret" }}
            - name: CREDENTIAL_PROVIDER_SECRET_NAMESPACE
              value: {{ .Values.agentio.epe.credentialProvider.mtls.secret.namespace | quote }}
            - name: CREDENTIAL_PROVIDER_SECRET_NAME
              value: {{ .Values.agentio.epe.credentialProvider.mtls.secret.name | quote }}
            {{- end }}
            {{- if .Values.agentio.epe.credentialProvider.mtls.insecureSkipVerify }}
            - name: CREDENTIAL_PROVIDER_INSECURE_SKIP_VERIFY
              value: "true"
            {{- end }}
            {{- range $name, $value := .Values.agentio.epe.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - {name: extproc, containerPort: {{ .Values.agentio.epe.service.grpcPort }}}
            - {name: health, containerPort: {{ .Values.agentio.epe.service.healthPort }}}
            - {name: metrics, containerPort: {{ .Values.agentio.epe.service.metricsPort }}}
          livenessProbe:
            grpc: {port: {{ .Values.agentio.epe.service.healthPort }}, service: liveness}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc: {port: {{ .Values.agentio.epe.service.healthPort }}, service: readiness}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.agentio.epe.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
          {{- if or $mountRoot $mountToken .Values.agentio.epe.extraVolumeMounts }}
          volumeMounts:
            {{- if $mountRoot }}
            - name: workload-root
              mountPath: /var/run/secrets/agentio
              readOnly: true
            {{- end }}
            {{- if $mountToken }}
            - name: workload-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            {{- end }}
            {{- with .Values.agentio.epe.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or $mountRoot $mountToken .Values.agentio.epe.extraVolumes }}
      volumes:
        {{- if $mountRoot }}
        - name: workload-root
          configMap:
            name: {{ .Values.agentio.agentiod.ca.trustBundleConfigMapName }}
            items:
            - key: root-cert.pem
              path: root-cert.pem
        {{- end }}
        {{- if $mountToken }}
        - name: workload-token
          projected:
            sources:
            - serviceAccountToken:
                audience: {{ .Values.agentio.agentiod.tokenAudience | quote }}
                expirationSeconds: 3600
                path: agentio-token
        {{- end }}
        {{- with .Values.agentio.epe.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.agentio.epe.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentio.epe.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentio.epe.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agentio.epe.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
