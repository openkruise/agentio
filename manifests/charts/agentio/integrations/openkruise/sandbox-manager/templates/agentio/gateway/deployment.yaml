            - name: TRUST_DOMAIN
              value: {{ .Values.agentio.global.trustDomain | quote }}
            - name: AGENTIO_XDS_ADDRESS
              value: {{ include "agentio.gateway.xdsAddress" . | quote }}
            - name: AGENTIO_GATEWAY_CONFIG
              value: {{ .Values.agentio.egressGateway.agentConfig | toJson | quote }}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: AGENTIO_TERMINATION_GRACE_PERIOD_SECONDS
              value: {{ .Values.agentio.egressGateway.terminationGracePeriodSeconds | quote }}
            {{- if ne .Values.agentio.epe.mode "disabled" }}
            - name: AGENTIO_EPE_ADDRESS
              value: {{ include "agentio.gateway.epeAddress" . | quote }}
            {{- end }}
            {{- range $name, $value := .Values.agentio.egressGateway.env }}
