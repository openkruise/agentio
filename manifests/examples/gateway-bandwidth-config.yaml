# Merge this fragment into your existing AgentioConfig. egressGateways is a
# replacement list: preserve the other gateways and their existing settings.
# Do not patch router retries onto the bandwidth-shaped CONNECT chain.
egressGateways:
  - name: agentio-egress
    namespace: agentio-system
    connectRateLimit:
      rateLimits:
        - actions:
            - genericKey: {descriptorKey: scope, descriptorValue: gateway}
      descriptors:
        - entries: [{key: scope, value: gateway}]
          tokenBucket: {maxTokens: 100, tokensPerFill: 100, fillInterval: 1s}
    bandwidthLimit:
      rateLimits:
        - actions:
            # agentio.sandbox.id is validated by Porter before this filter runs.
            - filterState: {key: agentio.sandbox.id, descriptorKey: sandbox}
      descriptors:
        - entries:
            - key: sandbox
          bandwidthLimit:
            uploadBytesPerSecond: 10485760
            downloadBytesPerSecond: 52428800
            # Shared per sandbox; oversized callback batches still pass whole.
            uploadBurstBytes: 1048576
            downloadBurstBytes: 5242880
