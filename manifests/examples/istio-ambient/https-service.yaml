apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: https-origin
  namespace: agentio-istio-demo
  labels:
    istio.io/use-waypoint: agentio-egress
    istio.io/use-waypoint-namespace: agentio-istio-system
spec:
  hosts: [httpbin.org]
  location: MESH_EXTERNAL
  ports:
  - number: 443
    name: https
    protocol: HTTPS
  resolution: DNS
