# Merge into AgentioConfig, preserving other gateways and their existing settings.
# Values are examples; size them for your workload and gateway capacity.
egressGateways:
  - name: agentio-egress
    namespace: agentio-system
    connectRateLimit:
      rateLimits:
        - actions:
            - genericKey: {descriptorKey: scope, descriptorValue: gateway}
      descriptors:
        - entries: [{key: scope, value: gateway}]
          tokenBucket: {maxTokens: 100, tokensPerFill: 100, fillInterval: 1s}
    connectConcurrencyLimit:
      rateLimits:
        - actions:
            # agentio.sandbox.id must be a globally unique identity validated by Porter.
            - filterState: {key: agentio.sandbox.id, descriptorKey: sandbox}
        - actions:
            - genericKey: {descriptorKey: scope, descriptorValue: gateway}
      descriptors:
        - entries: [{key: sandbox}]
          maxConcurrentStreams: 64
        - entries: [{key: scope, value: gateway}]
          maxConcurrentStreams: 4096
    bandwidthLimit:
      rateLimits:
        - actions:
            - filterState: {key: agentio.sandbox.id, descriptorKey: sandbox}
      descriptors:
        - entries: [{key: sandbox}]
          bandwidthLimit:
            uploadBytesPerSecond: 10485760
            downloadBytesPerSecond: 52428800
