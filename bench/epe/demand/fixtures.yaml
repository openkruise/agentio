apiVersion: v1
kind: Namespace
metadata:
  name: epe-demand-workloads
---
apiVersion: v1
kind: Node
metadata:
  name: epe-demand-inventory
spec:
  unschedulable: true
  taints:
  - key: epe-demand-inventory
    effect: NoSchedule
---
apiVersion: agents.kruise.io/v1alpha1
kind: SecurityProfile
metadata:
  name: epe-demand
  namespace: epe-demand-workloads
spec:
  selector:
    matchLabels:
      app: epe-demand
  rules:
  - name: block
    match:
    - domains: ['*']
      paths:
      - type: Exact
        value: /block
    actions:
      block:
        statusCode: 453
        body: bound-by-wds
