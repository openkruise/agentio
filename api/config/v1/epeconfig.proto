syntax = "proto3";
package agentio.config.v1;
option go_package = "github.com/openkruise/agentio/api/config/v1;configv1";

// EPEConfig configures EPE's global egress authorization and extension providers.
// YAML or JSON is decoded from each watched ConfigMap's data.config entry.
// Base and primary ConfigMaps overlay startup defaults in that order. Missing
// ConfigMaps or blank entries leave the lower layer unchanged. Invalid updates
// retain the last valid configuration; an invalid initial configuration uses
// startup defaults. Valid changes take effect without restarting EPE.
// Secret and ConfigMap references default to the configuration namespace.
//
// Example: register a callout service and a default credential service.
//
//   extensionProviders:
//   - name: policy-check
//     httpCallout:
//       url: https://policy.example.com/check
//       timeout: 500ms
//   - name: corporate
//     credentialProvider:
//       url: https://credentials.example.com/get
//       timeout: 2s
//   defaultProviders:
//     credentialProvider: corporate
message EPEConfig {
  // Named services available to EPE. Names must be unique across provider types.
  // Layers merge by name; a same-name entry replaces the whole provider.
  // Omitted or null lists inherit the lower layer; an explicit [] clears it.
  repeated ExtensionProvider extension_providers = 1;

  // Default services used when a caller does not select a provider explicitly.
  DefaultExtensionProviders default_providers = 2;

  // Global destination restrictions, independent of xDS and workload identity.
  // Omission/null inherits the lower layer; a supplied message replaces it.
  EgressAuthorization egress_authorization = 3;
}

// EgressAuthorization restricts destinations in the component consuming it.
// AgentioConfig applies it to native gateways; EPEConfig applies it to EPE requests.
// Examples below are EPEConfig content for a watched ConfigMap's data.config.
//
// Example: deny additional IPv4/IPv6 IPs. Built-in restrictions are appended
// automatically, so they do not need to be repeated here.
//
//   egressAuthorization:
//     deniedCIDRs:
//     - 192.0.2.10/32
//     - 2001:db8::10/128
//
// Example: inherit the lower layer's restrictions in a primary ConfigMap.
// Omitting egressAuthorization has the same effect as null.
//
//   egressAuthorization: null
//
// Example: clear inherited user restrictions. Built-in restrictions remain,
// and optional xDS TrafficPolicy authorization still applies when enabled.
//
//   egressAuthorization:
//     deniedCIDRs: []
message EgressAuthorization {
  // Deny these destination CIDRs on every port, before workload policy allows.
  // Use /32 for a single IPv4 address or /128 for a single IPv6 address.
  // IPv4-mapped IPv6 prefixes are not accepted; use the IPv4 prefix instead.
  // Both consumers always append 127.0.0.0/8, ::1/128, 0.0.0.0/32, ::/128,
  // 169.254.0.0/16, and fe80::/10.
  // Alibaba Cloud metadata (100.100.100.200/32) requires an explicit operator entry.
  // An empty list removes only user restrictions; built-ins cannot be disabled.
  repeated string denied_cidrs = 1 [json_name = "deniedCIDRs"];
}

// ExtensionProvider registers one typed service under a unique name.
message ExtensionProvider {
  // Local registration name, such as "corporate". Must be a DNS subdomain.
  // Environment defaults use "agentio-default-credential-provider"; this is an
  // ordinary name that configuration layers can override like any other.
  string name = 1;
  // Exactly one provider type must be configured.
  oneof provider {
    HTTPCalloutProvider http_callout = 2;
    CredentialProvider credential_provider = 3;
  }
}

// DefaultExtensionProviders selects services by their ExtensionProvider names.
message DefaultExtensionProviders {
  // Used only by credential references without an explicit provider.
  // Omitting defaultProviders inherits the lower layer's selection. An explicit
  // empty credentialProvider disables default selection.
  // Must identify a credentialProvider to serve lookups. A missing or wrong-type
  // provider fails at call time; no other provider is selected as a fallback.
  string credential_provider = 1;
}

// HTTPCalloutProvider defines a service implementing EPE's HTTPCallout protocol:
// EPE posts a JSON Invocation and expects a JSON Decision in response.
// This is distinct from the Envoy ext_proc service that EPE implements.
// Redirects are not followed. The client's response size limit is configured by
// HTTP_CALLOUT_MAX_RESPONSE_BYTES, independently of the rule's body disclosure limit.
//
// Example: require HTTP/2 with explicit connection and stream limits.
// Use an http:// URL with protocol: HTTP2 for prior-knowledge h2c.
//
//   extensionProviders:
//   - name: policy-check
//     httpCallout:
//       url: https://policy.example.com/check
//       timeout: 2s
//       protocol: HTTP2
//       connectionPool:
//         maxConnections: 16
//         maxIdleConnections: 8
//         idleTimeout: 90s
//       http2:
//         maxConcurrentStreams: 32
message HTTPCalloutProvider {
  // Absolute HTTP(S) endpoint, without userinfo or a fragment.
  string url = 1;
  // Positive Go duration, such as "500ms" or "2s". Defaults to 500ms.
  // Includes pool queueing, connection/SETTINGS establishment and response body reads.
  // An earlier caller deadline takes precedence.
  string timeout = 2;
  // HTTPS transport settings. Omission uses system roots without a client certificate.
  ClientTLS tls = 4;
  // AUTO preserves the default: HTTP/1.1 for http, ALPN negotiation for https.
  // HTTP2 requires h2c prior knowledge for http, or h2 over TLS for https.
  Protocol protocol = 5;
  enum Protocol {
    AUTO = 0;
    HTTP1 = 1;
    HTTP2 = 2;
  }
  // Connection limits apply independently to each provider in each EPE process.
  HTTPCalloutConnectionPool connection_pool = 6;
  // Applied whenever HTTP/2 is used, including AUTO negotiation.
  HTTPCalloutHTTP2 http2 = 7;
}

message HTTPCalloutConnectionPool {
  // Maximum connections, including idle and connecting connections. Defaults to 32 for HTTP2 and 128 for AUTO/HTTP1.
  // Must be between 1 and 2147483647.
  optional uint32 max_connections = 1;
  // Maximum idle connections. Defaults to 8 for HTTP2 and 64 for AUTO/HTTP1, bounded by max_connections.
  // Zero disables idle retention; must not exceed max_connections.
  optional uint32 max_idle_connections = 2;
  // Positive Go duration. Defaults to 90s.
  string idle_timeout = 3;
}

message HTTPCalloutHTTP2 {
  // Local outbound stream limit per connection, further bounded by peer SETTINGS.
  // Defaults to 32. Must be between 1 and 2147483647.
  optional uint32 max_concurrent_streams = 1;
}

// CredentialProvider defines the connection to a credential service.
// Its local ExtensionProvider name selects this connection; the credential
// request's credentialProviderName selects the remote credential configuration.
// Each provider has independent caches, configured process-wide at startup by
// TOKEN_CACHE_TTL, TOKEN_CACHE_MAX_SIZE, and STS_CACHE_MAX_SIZE.
message CredentialProvider {
  // Absolute HTTP(S) endpoint, without userinfo or a fragment.
  string url = 1;
  // Positive Go duration, such as "2s". Defaults to 500ms.
  string timeout = 2;
  // HTTPS transport settings. Omission uses system roots without a client certificate.
  ClientTLS tls = 3;
}

// ClientTLS configures outbound HTTPS connections from EPE to either provider
// type. It does not configure EPE's inbound ext_proc listener. Referenced Secrets,
// ConfigMaps, and files are watched; changes rebuild the affected provider and cache.
// CA and client identity sources are independent, so a Secret CA can be combined
// with a file-based client certificate, or vice versa.
// Omitting client identity configures server-only TLS; a client certificate is
// provided for mTLS only when configured and requested by the remote server.
//
// Example: verify only the server using a ConfigMap's ca.crt trust bundle.
// Place this block under httpCallout or credentialProvider. Omitting tls entirely
// for an HTTPS URL uses system roots and provides no client certificate.
//
//   tls:
//     caConfigMapRef:
//       name: provider-ca
//
// Example: use Secrets in the EPEConfig namespace for trust and client identity.
//
//   tls:
//     caSecretRef:
//       name: provider-ca
//     clientCertificateSecretRef:
//       name: epe-client
//
// Example: use PEM files supplied by the EPE deployment. Paths refer to the EPE
// container filesystem; configuring a path does not create a volume mount.
// Both path changes and certificate contents are reloaded without a restart.
//
//   tls:
//     caCertificateFile: /etc/epe/certs/ca.crt
//     clientCertificateFiles:
//       certificateFile: /etc/epe/certs/tls.crt
//       privateKeyFile: /etc/epe/certs/tls.key
message ClientTLS {
  // Defaults to URL hostname. Mutually exclusive with peerSpiffeIDs.
  string server_name = 1;
  // Exact URI SAN allowlist, for example:
  //   peerSpiffeIDs: ["spiffe://cluster.local/ns/agentio-system/sa/credential-provider"]
  // Verifies the certificate chain and requires a matching SPIFFE ID instead of
  // hostname verification. Mutually exclusive with serverName and insecureSkipVerify.
  // When empty, serverName or the URL hostname is verified unless
  // insecureSkipVerify is enabled; an empty list does not deny all providers.
  repeated string peer_spiffe_ids = 2 [json_name = "peerSpiffeIDs"];
  // Selects at most one CA source. Omission uses system roots.
  // An explicit but unavailable source fails unless optional is true.
  oneof ca_source {
    // PEM CA bundle from the Secret's fixed ca.crt data key. Missing or empty
    // ca.crt is unavailable material, handled according to optional.
    TargetReference ca_secret_ref = 3;
    // PEM CA bundle from the ConfigMap's fixed data["ca.crt"] entry. Missing
    // or empty ca.crt is unavailable material, handled according to optional.
    TargetReference ca_config_map_ref = 4;
    // Non-empty path to a PEM CA bundle inside the EPE container.
    string ca_certificate_file = 5;
  }
  // Selects at most one client identity source. Omission provides no client
  // certificate and does not require optional: true for server-only TLS.
  oneof client_certificate_source {
    // Client identity from tls.crt and tls.key, including environment defaults.
    // If neither key exists, reads legacy client.crt and client.key instead.
    // A present but incomplete, empty, or invalid standard pair never falls back.
    // Unavailable material is handled according to optional.
    TargetReference client_certificate_secret_ref = 6;
    // Client certificate and private key files, configured together.
    ProviderClientCertificateFiles client_certificate_files = 7;
  }
  // Disables server certificate verification; cannot be combined with peer IDs.
  bool insecure_skip_verify = 8;
  // Missing or unusable material uses system roots / no client certificate.
  // By default explicit sources fail closed. This does not disable verification.
  bool optional = 9;
}

// TargetReference identifies a Kubernetes object. The referring field defines
// the resource kind and fixed data keys to read; key names cannot be configured.
message TargetReference {
  // Required resource name.
  string name = 1;
  // Defaults to the EPEConfig namespace, not the calling workload's namespace.
  // An explicit Secret namespace requires list/watch access there for the EPE ServiceAccount.
  string namespace = 2;
}

// ProviderClientCertificateFiles reads a PEM client certificate/key pair from
// the EPE container filesystem. Both paths are required. File names are arbitrary;
// the tls.crt/tls.key and legacy client.crt/client.key conventions apply only to Secrets.
message ProviderClientCertificateFiles {
  // Non-empty path to the PEM client certificate.
  string certificate_file = 1;
  // Non-empty path to the matching PEM private key.
  string private_key_file = 2;
}
