syntax = "proto3";

// Control-plane-only configuration. These messages are decoded from ConfigMap
// YAML by field name (jsonpb) and are never packed into an Any or sent over
// xDS, so this proto package name is not a wire contract. Wire-bound egress
// policy messages live in api/extensions/v1/egresspolicy.proto instead.
package agentio.config.v1;

import "api/extensions/v1/egresspolicy.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "networking/v1alpha3/virtual_service.proto";

option go_package = "github.com/openkruise/agentio/api/config/v1;configv1";

// AgentioConfig is the complete configuration for the agentio controller.
message AgentioConfig {
  // External processing provider for sandbox traffic inspection and policy enforcement.
  ExtProcProvider sandbox_ext_proc = 1;

  // Ordered list of egress policies. Traffic is evaluated against policies
  // in order; the first matching policy's action is applied.
  repeated kruise.networking.extensions.v1.EgressPolicy egress_policies = 2;

  // Filter sandbox labels to reduce xds push size.
  repeated string sandbox_ignored_labels = 3;

  // Per-gateway settings; tls_termination lives inside each gateway here so
  // SDS can authorize on-demand cert pulls per gateway.
  repeated EgressGateway egress_gateways = 4;

  // Trusted processors appended in list order after the effective sandbox
  // processor. Responses run in reverse order. An absent/disabled sandbox
  // processor disables this list too, including per-gateway ext_proc: {}.
  // Only inspected HTTP traffic is processed, not CONNECT setup or TLS passthrough.
  // Names must be unique DNS labels. Empty lists remove all additional processors.
  repeated ExtProcProvider additional_ext_procs = 5;

  // Exact SPIFFE identities authorized for EPE Workload and TrafficPolicy
  // discovery. Empty disables EPE access. Clients must authenticate and use
  // the epe node type; declaring an identity in node metadata is not sufficient.
  repeated string trusted_epe_identities = 6 [json_name = "trustedEPEIdentities"];

}

// EgressGateway describes one sandbox egress gateway's behavior. The same
// message is used by AgentioConfig entries and Gateway API parametersRef
// ConfigMaps; runtime Deployment and Pod observations are not part of it.
message EgressGateway {
  // Declaration name when nested in AgentioConfig.egress_gateways. Omit this
  // field in a Gateway API parametersRef payload because Gateway metadata is
  // authoritative there.
  string name = 1;

  // Declaration namespace when nested in AgentioConfig.egress_gateways. Omit
  // this field in a Gateway API parametersRef payload.
  string namespace = 2;

  // Per-gateway TLS termination policy. nil means this gateway forwards all
  // TLS traffic without termination (the egress-gateway listener falls back to the
  // no-SNI-match protocolMatcher).
  TlsTerminationConfig tls_termination = 3;

  // Per-gateway ext_proc override. When set, this gateway uses its own
  // ext_proc endpoint instead of the global AgentioConfig.sandbox_ext_proc.
  // nil means fall back to the global configuration.
  // An explicit provider without service or service_ref disables ext_proc for this gateway.
  ExtProcProvider ext_proc = 4;

  // Per-gateway connect rate limit. Controls the rate at which new
  // H2 CONNECT streams are accepted on the connect_terminate HCM.
  // nil means no rate limiting.
  LocalRateLimitSettings connect_rate_limit = 5;

  // External services whose DNS result is overridden at this gateway. The
  // original request port and detected protocol are preserved; only the
  // upstream address is replaced by the configured endpoint.
  repeated EgressServiceEntry service_entries = 6;

  // Format of this gateway's built-in envoy access-log provider on stdout.
  // Applies to HTTP, TCP, CONNECT failures, and listener failures. Omitted or
  // empty means the built-in JSON format. Telemetry still controls log enablement
  // and filtering; explicitly overridden providers keep their own formats.
  AccessLogFormat access_log_format = 7;

  // Shapes TCP payload bytes on the CONNECT termination chain, independently
  // of connect_rate_limit (which counts new CONNECT streams). Requires the
  // community gateway image containing the bandwidth dynamic module.
  BandwidthLimitSettings bandwidth_limit = 8;

  // Limits active TCP CONNECT streams by trusted filter state, independently
  // of creation rate and byte bandwidth. Requires the community gateway image.
  ConnectConcurrencyLimitSettings connect_concurrency_limit = 9;

  // Business HTTP protocol settings, including HTTP after TLS termination.
  // Does not configure the outer HTTP/2 CONNECT tunnel.
  GatewayHttpSettings http = 10;

  // TCP forwarding connection timeouts, including the TLS termination relay.
  TcpSettings tcp = 11;

  // TLS origination settings. TLS interception remains in tls_termination.
  GatewayTlsSettings tls = 12;

  // Additional CA sources for destination and HTTPS proxy TLS verification.
  // The built-in public CA package is always retained.
  UpstreamTrustBundle upstream_trust_bundle = 13;

  // Connections matching any entry are forwarded to the original CONNECT
  // destination as TCP, without HTTP/TLS inspection or application processing.
  // CIDRs and ports are ANDed; entries within each list are ORed. An omitted
  // dimension matches any value. Empty entries match every TCP connection.
  // Existing transport access controls and CONNECT admission limits still apply.
  repeated TcpPassthroughMatch tcp_passthrough = 14;
}

// Configures the gateway's upstream CA union, independently of client trust.
message UpstreamTrustBundle {
  // Omitted or empty adds no extra CAs. Referenced ConfigMaps and Secrets are
  // watched; invalid updates retain the last valid gateway output.
  repeated UpstreamTrustSource additional_sources = 1;
}

message UpstreamTrustSource {
  // Exactly one source is required.
  oneof source {
    TrustSourceReference config_map_ref = 1;
    TrustSourceReference secret_ref = 2;
  }
}

message TrustSourceReference {
  // Required object name in Agentiod's mesh root namespace. Cross-namespace
  // references are not supported.
  string name = 1;
  // Required data key containing one or more PEM CA certificates, without private keys.
  string key = 2;
}

// CONNECT admission limits shared across workers/connections in one process.
message ConnectConcurrencyLimitSettings {
  // Uses the same ordered descriptor actions and distinct wildcard semantics
  // as bandwidthLimit; every matching group must have an available slot.
  repeated NetworkLimitRule rate_limits = 1;
  repeated ConnectConcurrencyDescriptor descriptors = 2;
  // Maximum live wildcard-derived counters. Defaults to 10000; must be positive.
  optional uint32 max_dynamic_buckets = 3;
}

message ConnectConcurrencyDescriptor {
  repeated NetworkLimitDescriptorEntry entries = 1;
  // Must be positive. Lowering the limit preserves existing streams and blocks
  // new admission until the active count is below the new limit.
  uint32 max_concurrent_streams = 2;
}

// BandwidthLimitSettings groups CONNECT streams by trusted filter state and
// shares byte budgets across connections/workers within one gateway process.
message BandwidthLimitSettings {
  repeated NetworkLimitRule rate_limits = 1;
  repeated BandwidthDescriptor descriptors = 2;

  // Maximum wildcard-derived buckets. Defaults to 10000; must be positive.
  optional uint32 max_dynamic_buckets = 3;

  // Soft streaming watermark, not a hard memory/burst cap. Defaults to 65536.
  optional uint32 buffer_limit_bytes = 4;
}

// Shared grouping configuration for CONNECT rate, concurrency and bandwidth limits.
// Each group generates one ordered descriptor independently of the other groups.
message NetworkLimitRule {
  repeated NetworkLimitAction actions = 1;
}

message NetworkLimitAction {
  // Exactly one source is required. Separate fields allow the controller's
  // JSON decoder to detect conflicting sources rather than silently pick one.
  NetworkLimitFilterStateAction filter_state = 1;
  NetworkLimitGenericKeyAction generic_key = 2;
}

message NetworkLimitFilterStateAction {
  // Required serialized UTF-8 filter-state value, read at CONNECT headers.
  string key = 1;
  string descriptor_key = 2;
}

message NetworkLimitGenericKeyAction {
  string descriptor_key = 1;
  string descriptor_value = 2;
}

message BandwidthDescriptor {
  // Must match an action group's keys in order. Full exact matches take
  // priority, then the first matching wildcard descriptor is selected.
  repeated NetworkLimitDescriptorEntry entries = 1;
  BandwidthRates bandwidth_limit = 2;
}

message NetworkLimitDescriptorEntry {
  string key = 1;
  // Empty/omitted means a separate bucket for each distinct runtime value.
  string value = 2;
}

message BandwidthRates {
  // Positive bytes per second. An omitted direction is unlimited.
  optional uint64 upload_bytes_per_second = 1;
  optional uint64 download_bytes_per_second = 2;
  // Positive burst capacity in bytes, shared by all streams matching this descriptor.
  // Requires the corresponding byte rate. Omitted means legacy one-batch pacing.
  // Whole callback batches are forwarded: a batch larger than this capacity waits
  // for prior consumption to refill, then passes whole and is charged in full.
  // This is not a strict wire-level burst or memory cap.
  optional uint64 upload_burst_bytes = 3;
  optional uint64 download_burst_bytes = 4;
}

// AccessLogFormat replaces the complete built-in access-log format for a gateway.
// Values support Envoy access-log substitution operators, including CEL.
message AccessLogFormat {
  // Non-blank text template. A trailing newline is appended if missing.
  // Cannot be combined with json.
  optional string text = 1;

  // Non-empty JSON object. Replaces all default fields, without merging.
  // Nested objects and typed values are supported. Empty values are omitted,
  // matching the built-in JSON format. Cannot be combined with text.
  google.protobuf.Struct json = 2;
}

// UpstreamTlsSettings controls upstream TLS origination, not termination.
message UpstreamTlsSettings {
  enum ProtocolVersion {
    DEFAULT = 0;
    TLSV1_2 = 1;
    TLSV1_3 = 2;
  }

  // DEFAULT means TLS 1.2. Only TLS 1.2 and TLS 1.3 are supported.
  ProtocolVersion min_protocol_version = 1;

  // DEFAULT means TLS 1.3. Must be >= the effective minimum version.
  ProtocolVersion max_protocol_version = 2;

  // Non-empty lists replace the built-in TLS 1.2 cipher list in order.
  // Empty or omitted lists use the defaults. Use explicit Envoy/OpenSSL cipher
  // names, not cipher expressions. This setting does not affect TLS 1.3.
  repeated string cipher_suites = 3;
}

// EgressServiceEntry binds one or more HTTP host identities to static upstream
// endpoints. Hosts are exact FQDNs; wildcard matching is intentionally not
// supported for static endpoints.
message EgressServiceEntry {
  // HTTP Host / :authority and TLS SNI identities for this service.
  repeated string hosts = 1;

  // Static upstream endpoints. Requests are distributed evenly across them.
  // At least one endpoint is required.
  repeated EgressServiceEntryEndpoint endpoints = 2;
}

// EgressServiceEntryEndpoint identifies a static upstream address. The request's
// original destination port is used when connecting to this address.
message EgressServiceEntryEndpoint {
  // IPv4 address of the upstream endpoint.
  string address = 1;
}

// TlsTerminationConfig defines which SNI domains should undergo TLS termination
// and which should bypass it in the sandbox egress gateway.
message TlsTerminationConfig {
  // Domains that should undergo TLS termination using on-demand certificates.
  // Supports wildcards (e.g. *.example.com). When a TLS ClientHello's SNI
  // matches one of these domains, traffic is routed to the TLS termination
  // filter chain.
  repeated string include_hosts = 1;

  // Domains that should bypass TLS termination. Traffic matching these
  // domains is forwarded as-is via the TCP filter chain without certificate
  // termination. Supports wildcards (e.g. *.internal.com).
  repeated string exclude_hosts = 2;
}

// HeaderSendMode mirrors Envoy's ProcessingMode.HeaderSendMode.
enum HeaderSendMode {
  // Use the default behavior (request headers are sent, response headers are not).
  DEFAULT = 0;
  // Send the header/trailer to the ext_proc server.
  SEND = 1;
  // Do not send the header/trailer to the ext_proc server.
  SKIP = 2;
}

// ExtProcProvider configures the external processing endpoint.
message ExtProcProvider {
  // DNS hostname or address. Used only when service_ref is absent.
  string service = 1;

  // Service port for the ext_proc endpoint. Defaults to 9002.
  // With service_ref, this is the Service port, mapped to EndpointSlice ports.
  uint32 port = 2;

  // Request processing mode options.
  ProcessingModeOptions request = 3;

  // Response processing mode options.
  ProcessingModeOptions response = 4;

  // If true, the filter will be allowed to continue processing even if the ext_proc
  // server is unavailable or returns an error. Defaults to false.
  bool failure_mode_allow = 5;

  // Cluster-level settings for the ext_proc upstream cluster.
  ClusterSettings cluster_settings = 6;

  // Timeout for each message sent to the ext_proc server. If the server does not
  // respond within this duration, the request is considered failed.
  // Format: golang duration string (e.g. "200ms", "1s"). Defaults to 200ms if not set.
  string message_timeout = 7;

  // TLS for the gateway-to-processor connection. Omission uses plaintext.
  ExtProcTLSSettings tls = 8;

  // Required, unique DNS label in additional_ext_procs; ignored for the primary
  // sandbox_ext_proc and per-gateway ext_proc. Identifies filters and clusters
  // independently of list position. The processor may request buffered bodies
  // using mode_override; the initial mode sends only request headers by default.
  string name = 9;

  // Kubernetes Service discovered through EDS. Takes precedence over service.
  // Both namespace and name are required. Missing Services or ready endpoints
  // produce an empty endpoint assignment; they do not fall back to DNS.
  ServiceReference service_ref = 10;
}

// ServiceReference identifies a Kubernetes Service for external processing.
message ServiceReference {
  string namespace = 1;
  string name = 2;
}

// ExtProcTLSSettings configures the gateway's transport to an external processor.
message ExtProcTLSSettings {
  enum Mode {
    // Use plaintext. No peer SPIFFE IDs may be configured.
    DISABLE = 0;
    // Use the gateway's workload certificate and trust bundle from local SDS.
    MUTUAL = 1;
  }
  // Defaults to DISABLE when mode is omitted, including an empty tls object.
  Mode mode = 1;
  // Required for MUTUAL: exact SPIFFE URI SANs accepted on the processor.
  repeated string peer_spiffe_ids = 2 [json_name = "peerSpiffeIDs"];
}

// ClusterSettings configures upstream cluster behavior.
message ClusterSettings {
  // HTTP protocol settings for the upstream cluster.
  HttpSettings http = 1;
}

// HttpSettings configures HTTP/2 protocol options for the upstream cluster.
message HttpSettings {
  // Maximum number of concurrent streams per HTTP/2 connection.
  // Defaults to 100 if not set.
  uint32 max_concurrent_streams = 1;

  // Maximum number of requests per connection before it is closed.
  // 0 means unlimited (default behavior).
  uint32 max_requests_per_connection = 2;
}

message ProcessingModeOptions {
    // Header send mode: DEFAULT, SEND, or SKIP.
    HeaderSendMode header_mode = 1;

    // Attributes to include in ext_proc headers.
    repeated string attributes = 2;
}

// TcpSettings configures TCP connection timeouts and limits for the
// sandbox egress TCPProxy filters and passthrough path.
message TcpSettings {
  // Maximum time a TCP connection can be idle before Envoy closes it.
  // Applies to TCPProxy filters on tls-terminate and forward-tcp chains.
  // Default 1h.
  google.protobuf.Duration idle_timeout = 1;

  // Absolute maximum lifetime of a downstream TCP connection regardless
  // of activity. Default unset (no limit).
  google.protobuf.Duration max_connection_duration = 2;
}

// HttpRoutingSettings configures host-specific HTTP timeout and retry policies.
message HttpRoutingSettings {
  // Settings for the fallback wildcard ("*") VirtualHost. Host overrides do
  // not inherit these settings. If nil, route timeout is 0 (disabled).
  HttpRouteSettings fallback = 1;

  // Per-host route overrides. Each entry generates a dedicated VirtualHost
  // with the specified hosts as domains. Evaluated by Envoy's domain
  // matching (exact > suffix > prefix > wildcard).
  repeated HttpRouteOverride host_overrides = 2;
}

// HttpRouteOverride binds HTTP route settings to a set of destination hosts.
message HttpRouteOverride {
  // Destination host patterns. Supports exact ("api.example.com") and
  // wildcard ("*.example.com") matching via Envoy VirtualHost domains.
  repeated string hosts = 1;

  // Route settings to apply for these hosts.
  HttpRouteSettings settings = 2;
}

// HttpRouteSettings configures Envoy route-level timeout and retry behavior.
message HttpRouteSettings {
  // Total request timeout. 0 means disabled (Envoy default).
  google.protobuf.Duration timeout = 1;

  // Retry policy for HTTP requests. Uses the Istio HTTPRetry definition.
  istio.networking.v1alpha3.HTTPRetry retries = 2;
}

// LocalRateLimitSettings configures Envoy's local rate limit HTTP filter
// on the connect_terminate HCM. Each new H2 CONNECT stream (= one client
// TCP connection) consumes one token from the bucket.
message LocalRateLimitSettings {
  // Global token bucket applied to all streams on this gateway.
  // Native Envoy also charges this bucket when a descriptor matches.
  // If unset, only descriptor-level rate limits apply.
  TokenBucket token_bucket = 1;

  // Token buckets matched against the ordered descriptors generated by rate_limits.
  // Matching and bucket lifecycle follow Envoy's native local rate limit filter.
  repeated RateLimitDescriptor descriptors = 2;

  // When true, each downstream H2 connection (ztunnel → egress gateway) gets
  // its own token bucket. Default false (shared across all connections).
  // Cannot be used together with wildcard descriptor values.
  bool per_downstream_connection = 3;

  // Same filterState/genericKey grouping format as bandwidthLimit and
  // connectConcurrencyLimit. Every group generates its own ordered descriptor.
  // When set, entries[].cel is forbidden; entries contain only matching keys/values.
  // When omitted, legacy entries[].cel configurations remain supported.
  repeated NetworkLimitRule rate_limits = 4;
}

// TokenBucket configures a token bucket rate limiter.
message TokenBucket {
  // Maximum tokens the bucket can hold. Also the initial token count.
  uint32 max_tokens = 1;

  // Tokens added per fill_interval. Defaults to 1 if not set.
  uint32 tokens_per_fill = 2;

  // Interval at which tokens_per_fill tokens are added to the bucket.
  // Must be >= 50ms.
  google.protobuf.Duration fill_interval = 3;
}

// RateLimitDescriptor defines a set of descriptor entries and an
// associated token bucket. When all entries match, this descriptor's
// bucket is used instead of (or in addition to) the global bucket.
message RateLimitDescriptor {
  // Entries that must all match for this descriptor to apply.
  repeated RateLimitEntry entries = 1;

  // Token bucket for streams matching this descriptor.
  TokenBucket token_bucket = 2;
}

// RateLimitEntry is a single key/value pair in a rate limit descriptor.
message RateLimitEntry {
  // Descriptor key used in the Envoy descriptor matching.
  string key = 1;

  // Descriptor value to match. An empty string acts as a wildcard,
  // creating a dynamic per-unique-value token bucket (e.g. per-IP).
  string value = 2;

  // Legacy CEL expression that produces the descriptor value at runtime.
  // Cannot be combined with rate_limits. Prefer rate_limits[].actions[].filter_state
  // for serialized string filter state, or generic_key for a fixed value.
  // Uses the envoy.rate_limit_descriptors.expr extension. The
  // expression has access to filter_state, e.g.:
  //   filter_state["downstream_peer"].name
  //   filter_state["downstream_peer"].namespace
  //   filter_state["agentio.peer.principal"]
  string cel = 3;
}

// GatewayHttpSettings configures the gateway's business HTTP listeners.
message GatewayHttpSettings {
  // Accept HTTP/1.0 requests. Defaults to true; explicitly false rejects them.
  // Requests still require a Host header; no default host is configured.
  optional bool accept_http_10 = 1 [json_name = "acceptHttp10"];

  // Maximum time a stream (including upgraded WebSocket/SSE) can be idle.
  // Defaults to 30min; explicitly 0 disables the timeout.
  google.protobuf.Duration stream_idle_timeout = 2;

  // Timeout and retry settings selected by the destination host.
  HttpRoutingSettings routing = 3;
}

// GatewayTlsSettings configures outgoing business TLS connections.
message GatewayTlsSettings {
  // TLS settings for connections to destinations and HTTPS proxies.
  // Omitted fields use the built-in upstream defaults.
  UpstreamTlsSettings origination = 1;
}

message TcpPassthroughMatch {
  // Original destination IPv4/IPv6 CIDRs; no DNS resolution is performed.
  repeated string cidrs = 1;
  // Original destination ports in the range 1-65535.
  repeated uint32 ports = 2;
}
