syntax = "proto3";

package agentio.extensions;

import "google/protobuf/any.proto";

option go_package = "github.com/openkruise/agentio/api/extensions/v1;extensionsv1";

// PolicyResourceReference identifies one policy and its reference-specific metadata.
message PolicyResourceReference {
  string name = 1;
  // UID is the source object's identity. Consumers currently resolve by name.
  string uid = 2;
  // Typed, policy-specific metadata; policy bodies are distributed separately.
  repeated google.protobuf.Any extensions = 3;
}

// PolicyReference carries ordered bindings for one policy type on a Workload
// or Sandbox. The enclosing resource supplies the target identity.
message PolicyReference {
  // TypeURL identifies the referenced resource type; it does not guarantee that
  // the server supports xDS subscriptions for that type. Consumers resolve
  // bodies through the source supported for that type.
  string type_url = 1;

  // Ordered according to the source policy API. The data plane evaluates the
  // referenced resources in this order and does not apply its own tie-breaks.
  // An empty list means no policies apply; an unresolved reference does not.
  repeated PolicyResourceReference resources = 2;
}

message SniTrafficPolicy {
  // Evaluated in the order produced by the control plane.
  repeated SniRule rules = 1;
}

message SniRule {
  SniMatch match = 1;
  SniAction action = 2;
}

message SniMatch {
  // Values are ORed. Supported forms are exact names, a leading wildcard,
  // and "*" for any non-empty SNI.
  repeated string sni = 1;

  // Original destination ports are ORed and ANDed with SNI. Empty means any
  // port; a missing destination port never matches a non-empty list.
  repeated uint32 ports = 2;
}

enum SniAction {
  SNI_ACTION_UNSPECIFIED = 0;
  SNI_ACTION_TLS_TERMINATION = 1;
  SNI_ACTION_PASSTHROUGH = 2;
  SNI_ACTION_DENY = 3;
}
