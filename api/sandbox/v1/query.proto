syntax = "proto3";

package agentio.sandbox;

import "api/sandbox/v1/sandbox.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/openkruise/agentio/api/sandbox/v1;sandboxv1";

// Resolves the binding and all inline policies in one read.
service SandboxQueryService {
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);
}

message GetSandboxRequest {
  // Canonical Sandbox UID or a workload namespace/name alias.
  string name = 1;
  // Used with the authenticated peer to resolve the same scope as ADS.
  string node_id = 2;
  google.protobuf.Struct node_metadata = 3;
}

message GetSandboxResponse {
  // Unset when the name has no binding. Lookup failures use gRPC status.
  Sandbox sandbox = 1;
  // Applies to both present and absent bindings. Zero requires a fresh lookup.
  google.protobuf.Duration cache_ttl = 2;
  // Opaque identity of the source object behind this answer. It changes when
  // the source is replaced (delete + recreate) and is empty when unknown.
  string version = 3;
}
