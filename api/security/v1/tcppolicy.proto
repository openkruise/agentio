syntax = "proto3";
package agentio.security;
option go_package = "github.com/openkruise/agentio/api/security/v1;securityv1";

// TCPPolicy is the ordered SecurityProfile destination fallthrough chain.
// It is embedded in the compiled SecurityProfile, not discovered separately.
message TCPPolicy {
  repeated TCPRule rules = 1;
}
message TCPRule {
  string name = 1;
  repeated TCPMatch match = 2;
  TCPAction action = 3;
}
message TCPMatch {
  repeated string cidrs = 1;
  repeated uint32 ports = 2;
}
enum TCPAction {
  TCP_ACTION_UNSPECIFIED = 0;
  TCP_ACTION_ALLOW = 1;
  TCP_ACTION_DENY = 2;
}
