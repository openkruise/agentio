syntax = "proto3";

package agentio.security;

option go_package = "github.com/openkruise/agentio/api/security/v1;securityv1";

// Traffic rules shared by native Workloads or carried inline in a Sandbox.
// Shared policies are independent xDS resources. Each Workload carries their
// complete ordered references, including global and namespace policies; scope
// and selector matching stay in the control plane. Authorizations are a separate
// compatibility projection for older data planes.
message TrafficPolicy {
  // Absent = this policy does not configure the direction.
  // Present (including an empty rule set) = this direction is configured.
  // First matching rule decides this policy. The enclosing policy stage defines
  // how the result and an unmatched direction compose with Workload policies.
  RuleSet ingress = 1;
  RuleSet egress = 2;

  // An IPv4 or IPv6 network prefix.
  message Address {
    // Network address in 4-byte IPv4 or 16-byte IPv6 form, with host bits zero.
    bytes address = 1;
    // Prefix length: 0..32 for IPv4, 0..128 for IPv6.
    uint32 length = 2;
  }

  enum Action {
    ALLOW = 0;
    DENY = 1;
  }

  enum Protocol {
    ALL = 0;
    TCP = 1;
    UDP = 2;
    ICMP = 3;
    SCTP = 4;
  }

  message RuleSet {
    // Declaration order within this policy. The first matching rule returns its action.
    // No per-policy default action.
    repeated Rule rules = 1;
  }

  message Rule {
    // ALLOW/DENY correspond to source allow/reject; the compiler sets the action.
    // The protobuf default is ALLOW. Unknown values are invalid.
    Action action = 1;
    // Required presence. Explicit {} matches all traffic.
    Match match = 2;
  }

  message Match {
    // The direction's peer condition and ports are ANDed; peers are ORed.
    // Ingress uses source_ips only; egress uses destination_ips only.
    // The opposite direction's address field is ignored.
    // Empty applicable address list = unconstrained, except egress with FQDNs.
    // Resolve peers in the control plane. If the applicable peer list resolves
    // to no addresses and has no egress FQDNs, omit the Rule while retaining
    // the configured direction. FQDN-only rules require compatible data planes.
    // Validate Address byte/prefix lengths and normalize host bits.
    repeated Address source_ips = 1;
    repeated Address destination_ips = 2;
    // Empty = any protocol/port. Entries are ORed.
    repeated PortMatch ports = 3;
    // Exact DNS names for outbound TCP, ORed with destination_ips.
    // Preserve these names even when control-plane DNS has no addresses.
    repeated string destination_fqdns = 4;
  }

  message PortMatch {
    // Unknown protocol values are invalid.
    // ALL with a port constraint only matches protocols with destination ports.
    Protocol protocol = 1;
    // Inclusive destination port bounds, when present, must be in 1..65535.
    // Only port: match that single port.
    // Only end_port: match 1..end_port.
    // Both: match port..end_port, requiring port <= end_port.
    // Neither: any port (no port test). ICMP requires both fields absent.
    optional uint32 port = 2;
    optional uint32 end_port = 3;
  }
}
