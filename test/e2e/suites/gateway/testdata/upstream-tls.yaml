apiVersion: v1
kind: ConfigMap
metadata:
  name: upstream-tls
data:
  # Close each response so CA updates are checked with a fresh upstream TLS handshake.
  envoy.yaml: |
    static_resources:
      listeners:
      - name: tls13
        address:
          socket_address: {address: 0.0.0.0, port_value: 18443}
        filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_3
                  tls_maximum_protocol_version: TLSv1_3
                tls_certificates:
                - certificate_chain: {filename: /etc/certs/tls.crt}
                  private_key: {filename: /etc/certs/tls.key}
          filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: tls13
              common_http_protocol_options: {max_requests_per_connection: 1}
              route_config:
                name: direct
                virtual_hosts:
                - name: direct
                  domains: ["*"]
                  routes:
                  - match: {prefix: "/"}
                    direct_response:
                      status: 200
                      body: {inline_string: "tls13"}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      - name: ecdhe
        address:
          socket_address: {address: 0.0.0.0, port_value: 18444}
        filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                  tls_maximum_protocol_version: TLSv1_2
                  cipher_suites: ["ECDHE-RSA-AES128-GCM-SHA256"]
                tls_certificates:
                - certificate_chain: {filename: /etc/certs/tls.crt}
                  private_key: {filename: /etc/certs/tls.key}
          filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ecdhe
              common_http_protocol_options: {max_requests_per_connection: 1}
              route_config:
                name: direct
                virtual_hosts:
                - name: direct
                  domains: ["*"]
                  routes:
                  - match: {prefix: "/"}
                    direct_response:
                      status: 200
                      body: {inline_string: "ecdhe"}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      - name: rsa128
        address:
          socket_address: {address: 0.0.0.0, port_value: 18445}
        filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                  tls_maximum_protocol_version: TLSv1_2
                  cipher_suites: ["AES128-GCM-SHA256"]
                tls_certificates:
                - certificate_chain: {filename: /etc/certs/tls.crt}
                  private_key: {filename: /etc/certs/tls.key}
          filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: rsa128
              common_http_protocol_options: {max_requests_per_connection: 1}
              route_config:
                name: direct
                virtual_hosts:
                - name: direct
                  domains: ["*"]
                  routes:
                  - match: {prefix: "/"}
                    direct_response:
                      status: 200
                      body: {inline_string: "rsa128"}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      - name: rsa256
        address:
          socket_address: {address: 0.0.0.0, port_value: 18446}
        filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                  tls_maximum_protocol_version: TLSv1_2
                  cipher_suites: ["AES256-GCM-SHA384"]
                tls_certificates:
                - certificate_chain: {filename: /etc/certs/tls.crt}
                  private_key: {filename: /etc/certs/tls.key}
          filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: rsa256
              common_http_protocol_options: {max_requests_per_connection: 1}
              route_config:
                name: direct
                virtual_hosts:
                - name: direct
                  domains: ["*"]
                  routes:
                  - match: {prefix: "/"}
                    direct_response:
                      status: 200
                      body: {inline_string: "rsa256"}
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  tls.crt: {{ printf "%q" .ServerCertChain }}
  tls.key: {{ printf "%q" .ServerKey }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upstream-tls
spec:
  replicas: 1
  selector:
    matchLabels: {app: upstream-tls}
  template:
    metadata:
      labels: {app: upstream-tls}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: envoy
        image: {{ .ForwardProxyImage }}
        imagePullPolicy: IfNotPresent
        args: ["-c", "/etc/envoy/envoy.yaml"]
        readinessProbe:
          tcpSocket: {port: 18443}
        volumeMounts:
        - name: config
          mountPath: /etc/envoy
        - name: config
          mountPath: /etc/certs
      volumes:
      - name: config
        configMap:
          name: upstream-tls
---
apiVersion: v1
kind: Service
metadata:
  name: {{ if index . "ServiceName" }}{{ index . "ServiceName" }}{{ else }}upstream-tls{{ end }}
spec:
  selector: {app: upstream-tls}
  ports:
  - name: tls-18443
    port: 18443
    targetPort: 18443
  - name: tls-18444
    port: 18444
    targetPort: 18444
  - name: tls-18445
    port: 18445
    targetPort: 18445
  - name: tls-18446
    port: 18446
    targetPort: 18446
---
apiVersion: v1
kind: Service
metadata:
  name: upstream-tls-wrong-san
spec:
  selector: {app: upstream-tls}
  ports:
  - name: tls-18443
    port: 18443
    targetPort: 18443
  - name: tls-18444
    port: 18444
    targetPort: 18444
  - name: tls-18445
    port: 18445
    targetPort: 18445
  - name: tls-18446
    port: 18446
    targetPort: 18446
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: upstream-tls-ca
  namespace: {{ .Namespace }}
data:
  ca.crt: {{ printf "%q" .ServerCA }}
